name: Security Alert Jira Task

permissions:
  contents: read
  security-events: read

on:
  secret_scanning_alert:
    types:
      - created
      - reopened
      - publicly_leaked

jobs:
  create-jira-task:
    runs-on: ubuntu-latest

    steps:
      - name: Create Jira issue
        id: jira
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
          REPO_NAME: ${{ github.repository }}
          ALERT_NUMBER: ${{ github.event.secret_scanning_alert.number }}
          ALERT_URL: ${{ github.event.secret_scanning_alert.html_url }}
          ALERT_STATE: ${{ github.event.secret_scanning_alert.state }}
          ALERT_SECRET_TYPE: ${{ github.event.secret_scanning_alert.secret_type_display_name }}
          ALERT_PUSH_PROTECTION_BYPASSED: ${{ github.event.secret_scanning_alert.push_protection_bypassed }}
          ALERT_PUSH_PROTECTION_BYPASSED_BY: ${{ github.event.secret_scanning_alert.push_protection_bypassed_by.login }}
          ALERT_CREATED_AT: ${{ github.event.secret_scanning_alert.created_at }}
          ALERT_UPDATED_AT: ${{ github.event.secret_scanning_alert.updated_at }}
          ALERT_RESOLVED_AT: ${{ github.event.secret_scanning_alert.resolved_at }}
          ALERT_RESOLUTION: ${{ github.event.secret_scanning_alert.resolution }}
          ALERT_RESOLUTION_COMMENT: ${{ github.event.secret_scanning_alert.resolution_comment }}
          ALERT_VALIDITY: ${{ github.event.secret_scanning_alert.validity }}
          ALERT_LOCATION_URL: ${{ github.event.secret_scanning_alert.locations_url }}
        run: |
          set -e

          SUMMARY_PREFIX="GitHub secret scanning alert #${ALERT_NUMBER}:"
          SUMMARY="${SUMMARY_PREFIX} ${REPO_NAME}"

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"
          JIRA_CURL_OPTS=(
            --retry 3
            --retry-all-errors
            --retry-delay 2
            --retry-max-time 30
            --connect-timeout 10
            --max-time 45
          )

          SEARCH_JQL=$(jq -rn --arg proj "$JIRA_PROJECT_KEY" --arg prefix "$SUMMARY_PREFIX" '$proj + " AND summary ~ "\\\"" + $prefix + "\\\""')
          SEARCH_RESP=$(curl -sS "${JIRA_CURL_OPTS[@]}" \
            -G \
            -H "$AUTH_HEADER" \
            --data-urlencode "jql=${SEARCH_JQL}" \
            --data-urlencode "maxResults=1" \
            "$JIRA_BASE_URL/rest/api/3/search")

          EXISTING_KEY=$(echo "$SEARCH_RESP" | jq -r '.issues[0].key // empty')
          EXISTING_ID=$(echo "$SEARCH_RESP" | jq -r '.issues[0].id // empty')

          if [ -n "$EXISTING_KEY" ]; then
            echo "issue_key=$EXISTING_KEY" >> "$GITHUB_OUTPUT"
            echo "issue_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
            echo "Jira issue already exists: $EXISTING_KEY"
            exit 0
          fi

          ADF_DESC=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg number "$ALERT_NUMBER" \
            --arg state "$ALERT_STATE" \
            --arg type "$ALERT_SECRET_TYPE" \
            --arg bypassed "$ALERT_PUSH_PROTECTION_BYPASSED" \
            --arg bypassed_by "$ALERT_PUSH_PROTECTION_BYPASSED_BY" \
            --arg created_at "$ALERT_CREATED_AT" \
            --arg updated_at "$ALERT_UPDATED_AT" \
            --arg resolved_at "$ALERT_RESOLVED_AT" \
            --arg resolution "$ALERT_RESOLUTION" \
            --arg resolution_comment "$ALERT_RESOLUTION_COMMENT" \
            --arg validity "$ALERT_VALIDITY" \
            --arg alert_url "$ALERT_URL" \
            --arg locations_url "$ALERT_LOCATION_URL" \
            'def para($t): {type:"paragraph", content:[{type:"text", text:$t}]};
             def linkPara($label; $url):
               { type:"paragraph", content:[
                   {type:"text", text:$label},
                   {type:"text", text:$url, marks:[{type:"link", attrs:{href:$url}}]}
                 ]};

             {
               type:"doc", version:1,
               content:[
                 para("GitHub secret scanning detected a security alert in the technical documentation repository."),
                 para("Repository: " + $repo),
                 para("Alert number: #" + $number),
                 para("State: " + $state),
                 para("Secret type: " + ($type // "unknown")),
                 para("Push protection bypassed: " + ($bypassed // "unknown")),
                 para("Bypassed by: " + ($bypassed_by // "not provided")),
                 para("Validity: " + ($validity // "not provided")),
                 para("Created at: " + ($created_at // "not provided")),
                 para("Updated at: " + ($updated_at // "not provided")),
                 para("Resolved at: " + ($resolved_at // "not provided")),
                 para("Resolution: " + ($resolution // "not provided")),
                 para("Resolution comment: " + ($resolution_comment // "not provided")),
                 linkPara("Alert URL: "; $alert_url),
                 linkPara("Alert locations API URL: "; $locations_url),
                 para("This ticket was created automatically by GitHub Actions for security triage.")
               ]
             }')

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY" \
            --argjson adf "$ADF_DESC" \
            '{
              fields: {
                project: { key: $proj },
                summary: $summary,
                description: $adf,
                issuetype: { name: "Task" },
                labels: ["security","secret-scanning","documentation","github-actions"]
              }
            }')

          RESP=$(curl -sS "${JIRA_CURL_OPTS[@]}" -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          ISSUE_KEY=$(echo "$RESP" | jq -r '.key // empty')
          ISSUE_ID=$(echo "$RESP" | jq -r '.id // empty')

          if [ -z "$ISSUE_KEY" ]; then
            echo "Failed to create Jira issue. Response:"
            echo "$RESP"
            exit 1
          fi

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "Created Jira issue: $ISSUE_KEY"