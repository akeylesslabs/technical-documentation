name: Link Checker

on:
  schedule:
    # Runs Mondays at 2am UTC
    - cron: "0 2 * * 1"
  workflow_dispatch: # allows manual runs

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # so we can push back

      - name: Install and Run lychee
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: >
            --verbose
            --no-progress
            --suggest
            --exclude-file .github/workflows/lychee-artifacts/.lycheeignore
            './**/*.md'
          output: .github/workflows/lychee-artifacts/lychee-out.md

      - name: Commit report back to repo
        if: always() # run even if lychee fails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/lychee-artifacts/lychee-out.md
          git commit -m "chore: update lychee report [skip ci]" || echo "No changes to commit"
          git push
