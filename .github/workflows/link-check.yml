name: Link Checker

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays at 2 AM UTC
  workflow_dispatch: # allow manual runs

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 1. Replace ReadMe doc links
      - name: Replace doc links
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Safely replace all (doc:slug) links with full URLs
          find . -type f -name "*.md" -print0 | \
            xargs -0 sed -i -E 's|\(doc:([^)]+)\)|\(https://docs.akeyless.io/docs/\1\)|g'

          # Show the changes this run
          echo "==== GIT DIFF (replacements made) ===="
          git diff --color

          # Count literal replacements using grep -F (fixed string)
          COUNT=$(grep -roF "(https://docs.akeyless.io/docs/" . --include="*.md" | wc -l)

          echo "$TIMESTAMP - Replaced doc: links. Total replacements so far: $COUNT" \
            >> .github/lychee/readme-link-replacer.log

          echo "REPLACER_SUMMARY=$COUNT replacements across Markdown files" >> $GITHUB_ENV

      # 2. Run Lychee link checker
      - name: Run Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2.0.2
        continue-on-error: true
        with:
          args: >
            --verbose
            --no-progress
            --exclude-path ".github"
            --exclude-link-local
            --exclude-loopback
            --include-mail
            './**/*.md'
          output: .github/lychee/lychee-out.md

      - name: Capture Lychee summary
        run: |
          BROKEN=$(grep -c "❌" .github/lychee/lychee-out.md || true)
          TOTAL=$(grep -cE "http[s]?://" .github/lychee/lychee-out.md || true)
          echo "LYCHEE_SUMMARY=$TOTAL links checked, $BROKEN broken" >> $GITHUB_ENV

      # 3. Commit changes to branch
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="automation/link-check"
          git fetch origin
          git checkout -B $BRANCH

          git add '*.md'
          git add .github/lychee/lychee-out.md .github/lychee/readme-link-replacer.log

          git commit -m "chore: update link replacements, lychee report & log [skip ci]" || echo "No changes to commit"
          git push origin $BRANCH --force

      # 4. Get commit URL
      - name: Get commit URL
        id: commiturl
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      # 5. Create Jira issue (ADF description)
      - name: Create Jira issue
        id: jira
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
          REPLACER_SUMMARY: ${{ env.REPLACER_SUMMARY }}
          LYCHEE_SUMMARY: ${{ env.LYCHEE_SUMMARY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: automation/link-check
          COMMIT_URL: ${{ steps.commiturl.outputs.url }}
        run: |
          set -e

          TS="$(date -u +'%Y-%m-%d %H:%M UTC')"
          SUMMARY="Link check ${TS} – $GITHUB_REPOSITORY@$BRANCH_NAME"

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"

          # Build ADF (Atlassian Document Format) description via jq
          ADF_DESC=$(jq -n \
            --arg repl  "$REPLACER_SUMMARY" \
            --arg lyc   "$LYCHEE_SUMMARY" \
            --arg run   "$RUN_URL" \
            --arg br    "$BRANCH_NAME" \
            --arg commit "$COMMIT_URL" \
            '{
              type: "doc", version: 1,
              content: [
                { "type":"paragraph", "content":[{ "type":"text", "text":"Automated link-checker run" }] },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"Replacement summary (all time): " },
                    { "type":"text", "text":$repl, "marks":[{"type":"strong"}] }
                  ]
                },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"Lychee summary: " },
                    { "type":"text", "text":$lyc, "marks":[{"type":"strong"}] }
                  ]
                },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"Workflow run: " },
                    { "type":"text", "text":$run, "marks":[{"type":"link","attrs":{"href":$run}}] }
                  ]
                },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"Branch: " },
                    { "type":"text", "text":$br }
                  ]
                },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"Commit: " },
                    { "type":"text", "text":$commit, "marks":[{"type":"link","attrs":{"href":$commit}}] }
                  ]
                },
                { "type":"paragraph", "content":[{ "type":"text", "text":"Files written:" }] },
                { "type":"bulletList", "content":[
                    { "type":"listItem", "content":[{ "type":"paragraph","content":[{ "type":"text","text":".github/lychee/lychee-out.md" }]}]},
                    { "type":"listItem", "content":[{ "type":"paragraph","content":[{ "type":"text","text":".github/lychee/readme-link-replacer.log" }]}]}
                  ]
                },
                { "type":"paragraph", "content":[{ "type":"text", "text":"This ticket was created automatically by GitHub Actions." }] }
              ]
            }')

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY" \
            --argjson adf "$ADF_DESC" \
            '{
              fields: {
                project: { key: $proj },
                summary: $summary,
                description: $adf,
                issuetype: { name: "Task" },
                labels: ["link-checker","automation","documentation"]
              }
            }')

          RESP=$(curl -sS -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          ISSUE_KEY=$(echo "$RESP" | jq -r '.key // empty')
          ISSUE_ID=$(echo "$RESP" | jq -r '.id // empty')

          if [ -z "$ISSUE_KEY" ]; then
            echo "Failed to create Jira issue. Response:"
            echo "$RESP"
            exit 1
          fi

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "Created Jira issue: $ISSUE_KEY"

      # 6. Attach artifacts to Jira issue
      - name: Attach artifacts to Jira issue
        if: always() && steps.jira.outputs.issue_key != ''
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          set -e
          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"

          attach_file () {
            local fpath="$1"
            if [ -f "$fpath" ]; then
              echo "Attaching $fpath to $ISSUE_KEY"
              curl -sS -X POST \
                -H "$AUTH_HEADER" \
                -H "X-Atlassian-Token: no-check" \
                -F "file=@${fpath}" \
                "$JIRA_BASE_URL/rest/api/3/issue/${ISSUE_KEY}/attachments" >/dev/null
            else
              echo "File not found: $fpath (skipping)"
            fi
          }

          attach_file ".github/lychee/lychee-out.md"
          attach_file ".github/lychee/readme-link-replacer.log"
