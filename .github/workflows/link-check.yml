name: Link Checker

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays at 2 AM UTC
  workflow_dispatch: # allow manual runs

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 1. Replace ReadMe doc links
      - name: Replace doc links
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          REPLACEMENTS=$(grep -rl "(doc:" . --include="*.md" | xargs -r sed -i -E 's|\(doc:([^)]+)\)|\(https://docs.akeyless.io/docs/\1\)|g')
          COUNT=$(grep -r "(https://docs.akeyless.io/docs/" . --include="*.md" | wc -l)
          echo "$TIMESTAMP - Replaced doc: links. Total replacements so far: $COUNT" >> .github/lychee/readme-link-replacer.log
          echo "REPLACER_SUMMARY=$COUNT replacements across Markdown files" >> $GITHUB_ENV

      # 2. Run Lychee link checker
      - name: Run Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          args: >
            --verbose
            --no-progress
            --suggest
            --exclude-path .github/lychee/.lycheeignore
            --exclude-link-local
            --exclude-loopback
            --include-mail
            './**/*.md'
          output: .github/lychee/lychee-out.md

      - name: Capture Lychee summary
        run: |
          BROKEN=$(grep -c "❌" .github/lychee/lychee-out.md || true)
          TOTAL=$(grep -cE "http[s]?://" .github/lychee/lychee-out.md || true)
          echo "LYCHEE_SUMMARY=$TOTAL links checked, $BROKEN broken" >> $GITHUB_ENV

      # 3. Commit changes to branch
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="automation/link-check"
          git fetch origin
          git checkout -B $BRANCH

          git add '*.md'
          git add .github/lychee/lychee-out.md .github/lychee/readme-link-replacer.log

          git commit -m "chore: update link replacements, lychee report & log [skip ci]" || echo "No changes to commit"
          git push origin $BRANCH --force

      # 4. Create or update PR using GitHub CLI
      - name: Create or update PR
        run: |
          BODY="Automated updates from link-checker workflow

          **Replacement summary:** $REPLACER_SUMMARY  
          **Lychee summary:** $LYCHEE_SUMMARY

          See the committed log and report files for full details."

          # Check if a PR from this branch already exists
          if gh pr list --head automation/link-check --base main --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "PR already exists, nothing to do."
          else
            gh pr create \
              --base main \
              --head automation/link-check \
              --title "chore: Link checker results" \
              --body "$BODY"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
