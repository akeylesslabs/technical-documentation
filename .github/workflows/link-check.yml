name: Link Checker

on:
  workflow_dispatch: # allow manual runs

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:

      # 0. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 1. Replace ReadMe doc links
      - name: Replace doc links
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Safely replace all (doc:slug) links with full URLs
          find . -type f -name "*.md" -print0 | \
            xargs -0 sed -i -E 's|\(doc:([^)]+)\)|\(https://docs.akeyless.io/docs/\1\)|g'

          # Show the changes this run
          echo "==== GIT DIFF (replacements made) ===="
          git diff --color

          # Count literal replacements using grep -F (fixed string)
          COUNT=$(grep -roF "(https://docs.akeyless.io/docs/" . --include="*.md" | wc -l)

          echo "$TIMESTAMP - Replaced doc: links. Total replacements so far: $COUNT" \
            >> .github/lychee/readme-link-replacer.log

          echo "REPLACER_SUMMARY=$COUNT replacements across Markdown files" >> $GITHUB_ENV

          # 2. Run Lychee (discovery pass)
          #
          # This first pass is used to discover candidate links directly from Lychee output
          # before any automated normalization takes place.
          - name: Run Lychee (discovery)
          id: lychee_discovery
          uses: lycheeverse/lychee-action@v2.0.2
          continue-on-error: true
          with:
            # Explicitly load repo ignore list; default discovery can be inconsistent
            # depending on the action working directory and invocation context.
            args: >
            --verbose
            --no-progress
            --exclude-file ".github/lychee/.lycheeignore"
            --exclude-path ".github"
            --exclude-link-local
            --exclude-loopback
            --include-mail
            './**/*.md'
            output: .github/lychee/lychee-discovery.md

          # 3. Normalize internal docs redirects
          #
          # Why this exists:
          # - Some legacy links under https://docs.akeyless.io/docs/* return HTTP redirects
          #   to newer docs slugs.
          # - We normalize these links in-source so the documentation points directly to the
          #   canonical destination and avoids redirect noise during link checks.
          #
          # Scope intentionally limited to docs.akeyless.io internal docs links only,
          # and candidate URLs are sourced from the Lychee discovery report first.
          - name: Normalize redirected docs links
          run: |
            set -e
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

            python3 - <<'PY'
            import json
            import pathlib
            import re
            import urllib.request

            root = pathlib.Path('.')
            md_files = list(root.rglob('*.md'))
            docs_url_pattern = re.compile(r"https://docs\.akeyless\.io/docs/[^\s\)\]>\"']+")

            discovery_path = pathlib.Path('.github/lychee/lychee-discovery.md')
            discovery_text = ''
            if discovery_path.exists():
              discovery_text = discovery_path.read_text(encoding='utf-8', errors='ignore')

            urls = set(docs_url_pattern.findall(discovery_text))

            source_mode = 'lychee-discovery'
            if not urls:
              source_mode = 'fallback-markdown-scan'
              for file_path in md_files:
                try:
                  text = file_path.read_text(encoding='utf-8')
                except Exception:
                  continue
                urls.update(docs_url_pattern.findall(text))

            redirects = {}
            for url in sorted(urls):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                with urllib.request.urlopen(req, timeout=20) as response:
                  final_url = response.geturl()
              except Exception:
                continue

              if final_url != url and final_url.startswith('https://docs.akeyless.io/docs/'):
                redirects[url] = final_url

            keys = sorted(redirects.keys(), key=len, reverse=True)
            changed_files = 0
            changed_links = 0

            if keys:
              exact_match = re.compile(r"(" + "|".join(re.escape(k) for k in keys) + r")(?![A-Za-z0-9_/#?&=%.-])")

              for file_path in md_files:
                try:
                  text = file_path.read_text(encoding='utf-8')
                except Exception:
                  continue

                replacements_in_file = [0]

                def replace_url(match):
                  replacements_in_file[0] += 1
                  return redirects[match.group(1)]

                updated = exact_match.sub(replace_url, text)
                if updated != text:
                  file_path.write_text(updated, encoding='utf-8')
                  changed_files += 1
                  changed_links += replacements_in_file[0]

            report = {
              'source_mode': source_mode,
              'total_urls_scanned': len(urls),
              'redirect_mappings_found': len(redirects),
              'files_updated': changed_files,
              'links_updated': changed_links,
              'redirect_mappings': redirects,
            }

            pathlib.Path('.github/lychee').mkdir(parents=True, exist_ok=True)
            with open('.github/lychee/docs-redirect-normalizer.json', 'w', encoding='utf-8') as handle:
              json.dump(report, handle, indent=2)

            with open('.github/lychee/docs-redirect-normalizer.log', 'a', encoding='utf-8') as handle:
              handle.write(
                f"source={report['source_mode']}; {report['files_updated']} files updated, {report['links_updated']} links normalized, "
                f"{report['redirect_mappings_found']} redirect mappings found, "
                f"{report['total_urls_scanned']} docs URLs scanned\n"
              )
            PY

            REDIRECT_SUMMARY=$(python3 - <<'PY'
            import json
            with open('.github/lychee/docs-redirect-normalizer.json', 'r', encoding='utf-8') as handle:
              report = json.load(handle)
            print(f"{report['links_updated']} links normalized across {report['files_updated']} markdown files")
            PY
            )

            echo "$TIMESTAMP - $REDIRECT_SUMMARY" >> .github/lychee/docs-redirect-normalizer.log
            echo "REDIRECT_SUMMARY=$REDIRECT_SUMMARY" >> $GITHUB_ENV

      # 4. Run Lychee (final pass)
      #
      # This second pass creates the official report after normalization.
      - name: Run Lychee (final)
        id: lychee
        uses: lycheeverse/lychee-action@v2.0.2
        continue-on-error: true
        with:
          # Explicitly load repo ignore list; default discovery can be inconsistent
          # depending on the action working directory and invocation context.
          args: >
            --verbose
            --no-progress
            --exclude-file ".github/lychee/.lycheeignore"
            --exclude-path ".github"
            --exclude-link-local
            --exclude-loopback
            --include-mail
            './**/*.md'
          output: .github/lychee/lychee-out.md

      - name: Capture Lychee summary
        run: |
          BROKEN=$(grep -c "❌" .github/lychee/lychee-out.md || true)
          TOTAL=$(grep -cE "http[s]?://" .github/lychee/lychee-out.md || true)
          echo "LYCHEE_SUMMARY=$TOTAL links checked, $BROKEN broken" >> $GITHUB_ENV

      # 5. Commit changes to branch
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="automation/link-check"
          git fetch origin
          git checkout -B $BRANCH

          git add '*.md'
          git add .github/lychee/lychee-discovery.md \
                  .github/lychee/lychee-out.md \
                  .github/lychee/readme-link-replacer.log \
                  .github/lychee/docs-redirect-normalizer.log \
                  .github/lychee/docs-redirect-normalizer.json

          git commit -m "chore: normalize docs redirects, update lychee report & logs [skip ci]" || echo "No changes to commit"
          git push origin $BRANCH --force

      # 6. Get commit URL
      - name: Get commit URL
        id: commiturl
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      # 7. Create Jira issue (ADF description)
      - name: Create Jira issue
        id: jira
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
          REPLACER_SUMMARY: ${{ env.REPLACER_SUMMARY }}
          REDIRECT_SUMMARY: ${{ env.REDIRECT_SUMMARY }}
          LYCHEE_SUMMARY: ${{ env.LYCHEE_SUMMARY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: automation/link-check
          COMMIT_URL: ${{ steps.commiturl.outputs.url }}
        run: |
          set -e

          TS="$(date -u +'%Y-%m-%d %H:%M UTC')"
          SUMMARY="Link check ${TS} – $GITHUB_REPOSITORY@$BRANCH_NAME"

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"

          # Build ADF (Atlassian Document Format) description via jq
          ADF_DESC=$(jq -n \
            --arg repl  "$REPLACER_SUMMARY" \
            --arg redir "$REDIRECT_SUMMARY" \
            --arg lyc   "$LYCHEE_SUMMARY" \
            --arg run   "$RUN_URL" \
            --arg br    "$BRANCH_NAME" \
            --arg commit "$COMMIT_URL" \
            '{
              type: "doc", version: 1,
              content: [
                { "type":"paragraph", "content":[{ "type":"text", "text":"Automated link-checker run" }] },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"Workflow run: " },
                    { "type":"text", "text":$run, "marks":[{"type":"link","attrs":{"href":$run}}] }
                  ]
                },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"Branch: " },
                    { "type":"text", "text":$br }
                  ]
                },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"Commit: " },
                    { "type":"text", "text":$commit, "marks":[{"type":"link","attrs":{"href":$commit}}] }
                  ]
                },
                { "type":"paragraph", "content":[{ "type":"text", "text":$repl }] },
                { "type":"paragraph", "content":[{ "type":"text", "text":$redir }] },
                { "type":"paragraph", "content":[{ "type":"text", "text":$lyc }] },
                { "type":"paragraph", "content":[{ "type":"text", "text":"Files written:" }] },
                { "type":"bulletList", "content":[
                    { "type":"listItem", "content":[{ "type":"paragraph","content":[{ "type":"text","text":".github/lychee/lychee-discovery.md" }]}]},
                    { "type":"listItem", "content":[{ "type":"paragraph","content":[{ "type":"text","text":".github/lychee/lychee-out.md" }]}]},
                    { "type":"listItem", "content":[{ "type":"paragraph","content":[{ "type":"text","text": ".github/lychee/readme-link-replacer.log" }]}]},
                    { "type":"listItem", "content":[{ "type":"paragraph","content":[{ "type":"text","text": ".github/lychee/docs-redirect-normalizer.log" }]}]},
                    { "type":"listItem", "content":[{ "type":"paragraph","content":[{ "type":"text","text": ".github/lychee/docs-redirect-normalizer.json" }]}]}
                  ]
                },
                { "type":"paragraph", "content":[{ "type":"text", "text":"This ticket was created automatically by GitHub Actions." }] }
              ]
            }')

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY" \
            --argjson adf "$ADF_DESC" \
            '{
              fields: {
                project: { key: $proj },
                summary: $summary,
                description: $adf,
                issuetype: { name: "Task" },
                labels: ["link-checker","automation","documentation"]
              }
            }')

          RESP=$(curl -sS -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          ISSUE_KEY=$(echo "$RESP" | jq -r '.key // empty')
          ISSUE_ID=$(echo "$RESP" | jq -r '.id // empty')

          if [ -z "$ISSUE_KEY" ]; then
            echo "Failed to create Jira issue. Response:"
            echo "$RESP"
            exit 1
          fi

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "Created Jira issue: $ISSUE_KEY"

      # 8. Attach artifacts to Jira issue
      - name: Attach artifacts to Jira issue
        if: always() && steps.jira.outputs.issue_key != ''
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          set -e
          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"

          attach_file () {
            local fpath="$1"
            if [ -f "$fpath" ]; then
              echo "Attaching $fpath to $ISSUE_KEY"
              curl -sS -X POST \
                -H "$AUTH_HEADER" \
                -H "X-Atlassian-Token: no-check" \
                -F "file=@${fpath}" \
                "$JIRA_BASE_URL/rest/api/3/issue/${ISSUE_KEY}/attachments" >/dev/null
            else
              echo "File not found: $fpath (skipping)"
            fi
          }

          attach_file ".github/lychee/lychee-discovery.md"
          attach_file ".github/lychee/lychee-out.md"
          attach_file ".github/lychee/readme-link-replacer.log"
          attach_file ".github/lychee/docs-redirect-normalizer.log"
          attach_file ".github/lychee/docs-redirect-normalizer.json"
