name: Secret Scan

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - "media/**"
  push:
    branches:
      - v1.0
  workflow_dispatch:

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    outputs:
      scan_summary: ${{ steps.analyze.outputs.summary }}
      leaks_found: ${{ steps.analyze.outputs.leaks_found }}
      rule_breakdown: ${{ steps.analyze.outputs.rule_breakdown }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks scan
        id: scan
        run: |
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="HEAD~1..${HEAD_SHA}"
          else
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          fi

          echo "Running gitleaks on commit range: ${LOG_OPTS}"
          REPORT_FILE="/repo/.gitleaks-report.json"
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 git /repo --redact --no-banner --exit-code 1 --log-opts="${LOG_OPTS}" --report-format json --report-path "$REPORT_FILE" || {
            EXIT_CODE=$?
            echo "Gitleaks scan failed with exit code $EXIT_CODE"
            if [ $EXIT_CODE -eq 1 ]; then
              echo "WARNING: Leaks detected in commit range. Review .github/LEAK_RESPONSE.md for remediation steps."
            fi
            exit $EXIT_CODE
          }

      - name: Analyze gitleaks results and generate breakdown
        id: analyze
        if: always()
        run: |
          REPORT_FILE=".gitleaks-report.json"

          if [ ! -f "$REPORT_FILE" ]; then
            echo "summary=Gitleaks scan completed: 0 leaks found" >> "$GITHUB_OUTPUT"
            echo "leaks_found=0" >> "$GITHUB_OUTPUT"
            echo "rule_breakdown=No leaks detected" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LEAK_COUNT=$(jq 'length' "$REPORT_FILE" 2>/dev/null || echo 0)

          if [ "$LEAK_COUNT" -eq 0 ]; then
            echo "summary=Gitleaks scan completed: 0 leaks found" >> "$GITHUB_OUTPUT"
            echo "leaks_found=0" >> "$GITHUB_OUTPUT"
            echo "rule_breakdown=No leaks detected" >> "$GITHUB_OUTPUT"
          else
            RULE_BREAKDOWN=$(jq -r 'group_by(.RuleID) | map({rule: .[0].RuleID, count: length}) | sort_by(.count) | reverse | map("\(.rule): \(.count)") | join(", ")' "$REPORT_FILE" 2>/dev/null || echo "")
            SUMMARY="Gitleaks scan completed: ${LEAK_COUNT} potential leaks found"

            echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
            echo "leaks_found=$LEAK_COUNT" >> "$GITHUB_OUTPUT"
            echo "rule_breakdown=$RULE_BREAKDOWN" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup temporary report
        if: always()
        run: rm -f .gitleaks-report.json /tmp/gitleaks-report.json

  cli-stdout-scan:
    name: CLI Stdout Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      violations_found: ${{ steps.scan.outputs.violations_found }}
      scan_summary: ${{ steps.scan.outputs.summary }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Markdown files to scan
        id: files
        run: |
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            LOG_RANGE="HEAD~1..${HEAD_SHA}"
          else
            LOG_RANGE="${BASE_SHA}..${HEAD_SHA}"
          fi

          echo "Resolving changed Markdown files in range: ${LOG_RANGE}"
          CHANGED=$(git diff --name-only "${LOG_RANGE}" -- '*.md' 2>/dev/null | grep '^docs/' || true)

          if [ -z "$CHANGED" ]; then
            echo "No docs Markdown files changed in this range."
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            echo "Markdown files to scan:"
            echo "$CHANGED"
            echo "$CHANGED" > /tmp/cli-scan-files.txt
            echo "files=/tmp/cli-scan-files.txt" >> "$GITHUB_OUTPUT"
          fi

      - name: Run CLI stdout scan
        id: scan
        run: |
          FILES_LIST="${{ steps.files.outputs.files }}"

          if [ -z "$FILES_LIST" ]; then
            echo "violations_found=0" >> "$GITHUB_OUTPUT"
            echo "summary=CLI stdout scan: no docs Markdown files changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          chmod +x .github/scripts/cli-stdout-scan.sh

          mapfile -t FILES < "$FILES_LIST"

          SCAN_EXIT=0
          OUTPUT=$(.github/scripts/cli-stdout-scan.sh --json-out /tmp/cli-scan-results.json "${FILES[@]}" 2>&1) || SCAN_EXIT=$?
          echo "$OUTPUT"

          if [ "$SCAN_EXIT" -eq 0 ]; then
            echo "violations_found=0" >> "$GITHUB_OUTPUT"
            echo "summary=CLI stdout scan: 0 violations found" >> "$GITHUB_OUTPUT"
          else
            VIOLATION_COUNT=$(jq '.violation_count' /tmp/cli-scan-results.json 2>/dev/null || echo 0)
            echo "violations_found=${VIOLATION_COUNT}" >> "$GITHUB_OUTPUT"
            echo "summary=CLI stdout scan: ${VIOLATION_COUNT} violation(s) found" >> "$GITHUB_OUTPUT"
          fi

          exit "$SCAN_EXIT"

      - name: Post or update PR comment
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/cli-stdout-pr-comment.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --json-results /tmp/cli-scan-results.json \
            --violations-found "${{ steps.scan.outputs.violations_found || '0' }}" \
            --token "$GH_TOKEN"
