name: Automated Workflow Fixes

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays at 2 AM UTC
  workflow_dispatch:
    inputs:
      min_severity:
        description: "Minimum severity to include (low, medium, high, critical)"
        required: false
        default: low
      force_alert_mode:
        description: "Force alert mode (auto, immediate, digest)"
        required: false
        default: auto
      categories:
        description: "Optional comma-separated category filter"
        required: false
        default: ""
      stale_suppression_days:
        description: "Suppress repeat alerts for the same version within N days"
        required: false
        default: "7"
      disable_jira_write:
        description: "Disable Jira create/update for this manual run"
        required: false
        default: "false"
      reopen_target_status_names:
        description: "Exact Jira target status names (comma-separated)"
        required: false
        default: "Triage,Backlog,In Progress"

jobs:
  link-check:
    uses: ./.github/workflows/reusable-link-check.yml
    with:
      push_changes: true
      branch_name: automation/link-check
    secrets: inherit

  markdownlint:
    uses: ./.github/workflows/reusable-markdownlint.yml
    with:
      push_changes: true
      branch_name: automation/markdownlint
    secrets: inherit

  spell-check:
    uses: ./.github/workflows/reusable-spell-check.yml
    with:
      push_changes: true
      branch_name: automation/spell-check
    secrets: inherit

  cli-path-check:
    uses: ./.github/workflows/reusable-cli-command-path-check.yml
    with:
      push_changes: true
      branch_name: automation/cli-command-path-check
    secrets: inherit

  readme-constraints:
    uses: ./.github/workflows/readme-docs-constraints.yml
    secrets: inherit

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    outputs:
      scan_summary: ${{ steps.scan.outputs.summary }}
      leaks_found: ${{ steps.scan.outputs.leaks_found }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks secret scan
        id: scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 dir /repo --redact --no-banner --exit-code 0 2>&1 | tee /tmp/gitleaks-output.txt || true

          LEAKS_FOUND=$(grep -o "leaks found: [0-9]*" /tmp/gitleaks-output.txt | grep -o "[0-9]*" || echo "0")
          if grep -q "no leaks found" /tmp/gitleaks-output.txt; then
            LEAKS_FOUND=0
          fi

          SUMMARY="Gitleaks secret scan completed: ${LEAKS_FOUND} potential leaks found"
          echo "summary=${SUMMARY}" >> "$GITHUB_OUTPUT"
          echo "leaks_found=${LEAKS_FOUND}" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY"

  dependency-change-monitor:
    runs-on: ubuntu-latest
    outputs:
      dep_summary: ${{ steps.capture.outputs.dep_summary }}
      dep_findings: ${{ steps.capture.outputs.dep_findings }}
      dep_top5: ${{ steps.capture.outputs.dep_top5 }}
      dep_digest_key: ${{ steps.capture.outputs.dep_digest_key }}
      dep_dedupe_label: ${{ steps.capture.outputs.dep_dedupe_label }}
      dep_alert_mode: ${{ steps.capture.outputs.dep_alert_mode }}
      dep_high_critical: ${{ steps.capture.outputs.dep_high_critical }}
      dep_stale_suppressed: ${{ steps.capture.outputs.dep_stale_suppressed }}
      dep_cooldown_skips: ${{ steps.capture.outputs.dep_cooldown_skips }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore dependency monitor state cache
        uses: actions/cache/restore@v6
        with:
          path: .github/dependency-monitor/state
          key: dep-monitor-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            dep-monitor-state-${{ github.ref_name }}-

      - name: Ensure state directory exists
        run: |
          mkdir -p .github/dependency-monitor/state

      - name: Collect dependency changes
        run: |
          set -euo pipefail

          MIN_SEVERITY="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.min_severity || 'low' }}"
          FORCE_ALERT_MODE="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_alert_mode || 'auto' }}"
          CATEGORY_FILTER="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.categories || '' }}"
          STALE_SUPPRESSION_DAYS="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stale_suppression_days || '7' }}"

          python .github/scripts/collect_dependency_changes.py \
            --registry .github/dependency-monitor/registry.json \
            --out-json .github/dependency-monitor/dependency-monitor-report.json \
            --out-md .github/dependency-monitor/dependency-monitor-report.md \
            --out-metrics .github/dependency-monitor/dependency-monitor-metrics.json \
            --state-in .github/dependency-monitor/state/last-seen.json \
            --state-out .github/dependency-monitor/state/last-seen.json \
            --min-severity "$MIN_SEVERITY" \
            --force-alert-mode "$FORCE_ALERT_MODE" \
            --categories "$CATEGORY_FILTER" \
            --stale-suppression-days "$STALE_SUPPRESSION_DAYS"

      - name: Capture dependency outputs
        id: capture
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path('.github/dependency-monitor/dependency-monitor-report.json').read_text(
                  encoding='utf-8'
              )
          )

          summary = (
              f"Collected {report['docs_impacting_findings']} docs-impacting findings "
              f"from {report['dependencies_configured']} configured dependencies "
              f"across {len(report['categories_covered'])} categories"
          )

          top_lines = []
          for finding in report.get('top_findings', []):
              line = (
                  f"[{finding['severity'].upper()}] {finding['name']} "
                  f"{finding['previous_version']} -> {finding['version']} "
                  f"({finding['change_type']}) {finding['release_url']}"
              )
              top_lines.append(line)

          gh_output = Path(os.environ['GITHUB_OUTPUT'])
          with gh_output.open('a', encoding='utf-8') as output:
              output.write(f"dep_summary={summary}\n")
              output.write(f"dep_findings={report['docs_impacting_findings']}\n")
              output.write(f"dep_digest_key={report['digest_key']}\n")
              output.write(f"dep_dedupe_label={report['dedupe_label']}\n")
              output.write(f"dep_alert_mode={report['alert_mode']}\n")
              output.write(f"dep_high_critical={report['high_or_critical_count']}\n")
              output.write(f"dep_stale_suppressed={report.get('stale_suppressed', 0)}\n")
              output.write(f"dep_cooldown_skips={report.get('cooldown_skips', 0)}\n")
              output.write('dep_top5<<EOF\n')
              output.write('\n'.join(top_lines))
              output.write('\nEOF\n')
          PY

      - name: Upload dependency monitor artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-monitor-report
          path: |
            .github/dependency-monitor/dependency-monitor-report.json
            .github/dependency-monitor/dependency-monitor-report.md
            .github/dependency-monitor/dependency-monitor-metrics.json
            .github/dependency-monitor/state/last-seen.json

      - name: Save dependency monitor state cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .github/dependency-monitor/state
          key: dep-monitor-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Create or update Jira dependency alert
        id: jira
        if: ${{ steps.capture.outputs.dep_findings != '0' && (github.event_name != 'workflow_dispatch' || github.event.inputs.disable_jira_write != 'true') }}
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
          DEP_SUMMARY: ${{ steps.capture.outputs.dep_summary }}
          DEP_TOP5: ${{ steps.capture.outputs.dep_top5 }}
          DEP_FINDINGS: ${{ steps.capture.outputs.dep_findings }}
          DEP_ALERT_MODE: ${{ steps.capture.outputs.dep_alert_mode }}
          DEP_DIGEST_KEY: ${{ steps.capture.outputs.dep_digest_key }}
          DEP_DEDUPE_LABEL: ${{ steps.capture.outputs.dep_dedupe_label }}
          REOPEN_TARGET_STATUS_NAMES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reopen_target_status_names || 'Triage,Backlog,In Progress' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${JIRA_BASE_URL:-}" ] || [ -z "${JIRA_EMAIL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ] || [ -z "${JIRA_PROJECT_KEY:-}" ]; then
            echo "Jira secrets are not fully configured; skipping dependency alert issue creation."
            exit 0
          fi

          TS="$(date -u +'%Y-%m-%d %H:%M UTC')"
          WEEK_KEY="$(date -u +'%G-W%V')"

          if [ "$DEP_ALERT_MODE" = "immediate" ]; then
            SUMMARY="Dependency Change Alert [${DEP_DIGEST_KEY}] ${TS}"
            MODE_LABEL="dep-immediate"
          else
            SUMMARY="Dependency Change Digest ${WEEK_KEY} [${DEP_DIGEST_KEY}]"
            MODE_LABEL="dep-digest"
          fi

          AUTH_HEADER="Authorization: Basic $(printf '%s:%s' "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"
          JIRA_CURL_OPTS=(
            --retry 3
            --retry-all-errors
            --retry-delay 2
            --retry-max-time 30
            --connect-timeout 10
            --max-time 45
          )

          SEARCH_RESP=$(curl -sS "${JIRA_CURL_OPTS[@]}" -G \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data-urlencode "jql=project = ${JIRA_PROJECT_KEY} AND labels = dependency-monitor AND labels = ${DEP_DEDUPE_LABEL} ORDER BY created DESC" \
            --data-urlencode "maxResults=1" \
            --data-urlencode "fields=key" \
            "$JIRA_BASE_URL/rest/api/3/search")

          EXISTING_KEY=$(echo "$SEARCH_RESP" | jq -r '.issues[0].key // empty')

          ADF_DESC=$(jq -n \
            --arg run "$RUN_URL" \
            --arg depSummary "$DEP_SUMMARY" \
            --arg depTop5 "$DEP_TOP5" \
            --arg depMode "$DEP_ALERT_MODE" \
            --arg depCount "$DEP_FINDINGS" \
            --arg key "$DEP_DIGEST_KEY" \
            'def para($t): {type:"paragraph", content:[{type:"text", text:$t}]};
             def codeBlock($t): {type:"codeBlock", attrs:{language:""}, content:[{type:"text", text:$t}]};
             {
               type:"doc", version:1,
               content:[
                 para("Dependency change monitor run generated docs-impacting findings."),
                 para("Run URL: " + $run),
                 para("Mode: " + $depMode),
                 para("Digest key: " + $key),
                 para("Findings count: " + $depCount),
                 para($depSummary),
                 para("Top findings (includes source links):"),
                 codeBlock($depTop5),
                 para("Review suggested docs and triage for required updates.")
               ]
             }')

          if [ -n "$EXISTING_KEY" ]; then
            ISSUE_DATA=$(curl -sS "${JIRA_CURL_OPTS[@]}" -G \
              -H "$AUTH_HEADER" \
              -H "Content-Type: application/json" \
              --data-urlencode "fields=status" \
              "$JIRA_BASE_URL/rest/api/3/issue/${EXISTING_KEY}")

            STATUS_CATEGORY=$(echo "$ISSUE_DATA" | jq -r '.fields.status.statusCategory.key // empty')
            if [ "$STATUS_CATEGORY" = "done" ]; then
              TRANSITIONS=$(curl -sS "${JIRA_CURL_OPTS[@]}" \
                -H "$AUTH_HEADER" \
                -H "Content-Type: application/json" \
                "$JIRA_BASE_URL/rest/api/3/issue/${EXISTING_KEY}/transitions")

              TARGET_STATUS_JSON=$(printf '%s' "$REOPEN_TARGET_STATUS_NAMES" \
                | tr ',' '\n' \
                | sed 's/^ *//;s/ *$//' \
                | sed '/^$/d' \
                | jq -R . \
                | jq -s .)

              REOPEN_ID=$(echo "$TRANSITIONS" | jq -r --argjson targets "$TARGET_STATUS_JSON" '
                .transitions[]
                | select(.to.statusCategory.key != "done")
                | select(($targets | index(.to.name)) != null)
                | .id
              ' | head -n 1)

              if [ -n "$REOPEN_ID" ]; then
                curl -sS "${JIRA_CURL_OPTS[@]}" -X POST \
                  -H "$AUTH_HEADER" \
                  -H "Content-Type: application/json" \
                  --data "$(jq -n --arg id "$REOPEN_ID" '{transition:{id:$id}}')" \
                  "$JIRA_BASE_URL/rest/api/3/issue/${EXISTING_KEY}/transitions" >/dev/null
              else
                echo "No exact reopen transition found for configured status names: $REOPEN_TARGET_STATUS_NAMES"
              fi
            fi

            COMMENT_PAYLOAD=$(jq -n --argjson adf "$ADF_DESC" '{body: $adf}')
            curl -sS "${JIRA_CURL_OPTS[@]}" -X POST \
              -H "$AUTH_HEADER" \
              -H "Content-Type: application/json" \
              --data "$COMMENT_PAYLOAD" \
              "$JIRA_BASE_URL/rest/api/3/issue/${EXISTING_KEY}/comment" >/dev/null

            echo "Updated existing dependency-monitor issue: $EXISTING_KEY"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY" \
            --arg modeLabel "$MODE_LABEL" \
            --arg dedupeLabel "$DEP_DEDUPE_LABEL" \
            --argjson adf "$ADF_DESC" \
            '{
              fields: {
                project: { key: $proj },
                summary: $summary,
                description: $adf,
                issuetype: { name: "Task" },
                labels: ["automation", "documentation", "dependency-monitor", $modeLabel, $dedupeLabel]
              }
            }')

          CREATE_RESP=$(curl -sS "${JIRA_CURL_OPTS[@]}" -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          ISSUE_KEY=$(echo "$CREATE_RESP" | jq -r '.key // empty')
          if [ -z "$ISSUE_KEY" ]; then
            echo "Failed to create dependency-monitor Jira issue. Response:"
            echo "$CREATE_RESP"
            exit 1
          fi

          echo "Created dependency-monitor issue: $ISSUE_KEY"

  aggregate-and-jira:
    runs-on: ubuntu-latest
    needs:
      - link-check
      - markdownlint
      - spell-check
      - cli-path-check
      - readme-constraints
      - secret-scan
      - dependency-change-monitor
    if: always()

    steps:
      - name: Prepare report directory
        run: |
          mkdir -p .github/automation-reports

      - name: Download link check artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: link-check-artifacts
          path: .github/automation-reports/link-check-artifacts

      - name: Download markdownlint artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: markdownlint-artifacts
          path: .github/automation-reports/markdownlint-artifacts

      - name: Download cspell artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cspell-artifacts
          path: .github/automation-reports/cspell-artifacts

      - name: Download CLI path artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cli-command-path-artifacts
          path: .github/automation-reports/cli-command-path-artifacts

      - name: Download ReadMe constraints artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: readme-docs-constraints-report
          path: .github/automation-reports/readme-docs-constraints-report

      - name: Download dependency monitor artifacts
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dependency-monitor-report
          path: .github/automation-reports/dependency-monitor-report

      - name: Build aggregated findings report
        id: aggregate
        env:
          REPLACER_SUMMARY: ${{ needs.link-check.outputs.replacer_summary }}
          REDIRECT_SUMMARY: ${{ needs.link-check.outputs.redirect_summary }}
          LYCHEE_SUMMARY: ${{ needs.link-check.outputs.lychee_summary }}
          LYCHEE_BROKEN: ${{ needs.link-check.outputs.lychee_broken }}
          LYCHEE_COMMIT_URL: ${{ needs.link-check.outputs.commit_url }}

          MARKDOWNLINT_SUMMARY: ${{ needs.markdownlint.outputs.markdownlint_summary }}
          MARKDOWNLINT_VIOLATIONS: ${{ needs.markdownlint.outputs.markdownlint_violations }}
          MARKDOWNLINT_COMMIT_URL: ${{ needs.markdownlint.outputs.commit_url }}

          CSPELL_SUMMARY: ${{ needs.spell-check.outputs.cspell_summary }}
          CSPELL_ISSUE_COUNT: ${{ needs.spell-check.outputs.cspell_issue_count }}
          CSPELL_TOP5: ${{ needs.spell-check.outputs.cspell_top5 }}
          CSPELL_COMMIT_URL: ${{ needs.spell-check.outputs.commit_url }}

          CLI_PATH_SUMMARY: ${{ needs.cli-path-check.outputs.cli_path_summary }}
          CLI_PATH_FAILURES: ${{ needs.cli-path-check.outputs.cli_path_failures }}
          CLI_PATH_TOP5: ${{ needs.cli-path-check.outputs.cli_path_top5 }}
          CLI_PATH_COMMIT_URL: ${{ needs.cli-path-check.outputs.commit_url }}

          SECRET_SCAN_SUMMARY: ${{ needs.secret-scan.outputs.scan_summary }}
          SECRET_SCAN_LEAKS: ${{ needs.secret-scan.outputs.leaks_found }}
          SECRET_SCAN_RULES: ${{ needs.secret-scan.outputs.rule_breakdown }}

          README_CONSTRAINTS_SUMMARY: ${{ needs.readme-constraints.outputs.constraints_summary }}
          README_VIOLATIONS_TOTAL: ${{ needs.readme-constraints.outputs.violations_total }}

          DEP_SUMMARY: ${{ needs.dependency-change-monitor.outputs.dep_summary }}
          DEP_FINDINGS: ${{ needs.dependency-change-monitor.outputs.dep_findings }}
          DEP_TOP5: ${{ needs.dependency-change-monitor.outputs.dep_top5 }}
          DEP_ALERT_MODE: ${{ needs.dependency-change-monitor.outputs.dep_alert_mode }}
          DEP_DIGEST_KEY: ${{ needs.dependency-change-monitor.outputs.dep_digest_key }}
          DEP_DEDUPE_LABEL: ${{ needs.dependency-change-monitor.outputs.dep_dedupe_label }}

          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e

          read_report() {
            local file_path="$1"
            local fallback="$2"
            if [ -f "$file_path" ]; then
              cat "$file_path"
            else
              printf '%s' "$fallback"
            fi
          }

          LYCHEE_BROKEN="${LYCHEE_BROKEN:-0}"
          MARKDOWNLINT_VIOLATIONS="${MARKDOWNLINT_VIOLATIONS:-0}"
          CSPELL_ISSUE_COUNT="${CSPELL_ISSUE_COUNT:-0}"
          CLI_PATH_FAILURES="${CLI_PATH_FAILURES:-0}"
          SECRET_SCAN_LEAKS="${SECRET_SCAN_LEAKS:-0}"
          README_VIOLATIONS_TOTAL="${README_VIOLATIONS_TOTAL:-0}"
          DEP_FINDINGS="${DEP_FINDINGS:-0}"

          FINDINGS_TOTAL=$((LYCHEE_BROKEN + MARKDOWNLINT_VIOLATIONS + CSPELL_ISSUE_COUNT + CLI_PATH_FAILURES + SECRET_SCAN_LEAKS + README_VIOLATIONS_TOTAL + DEP_FINDINGS))

          LINK_CHECK_ALL=$(read_report \
            ".github/automation-reports/link-check-artifacts/.github/lychee/lychee-out.md" \
            "No link-check details artifact found.")
          MARKDOWNLINT_ALL=$(read_report \
            ".github/automation-reports/markdownlint-artifacts/.github/markdownlint/markdownlint-fix-out.txt" \
            "No markdownlint details artifact found.")
          CSPELL_ALL=$(read_report \
            ".github/automation-reports/cspell-artifacts/.github/cspell/cspell-out.txt" \
            "No cspell details artifact found.")
          CLI_PATH_ALL=$(read_report \
            ".github/automation-reports/cli-command-path-artifacts/.github/cli-command-paths/command-path-check.md" \
            "No CLI command path details artifact found.")
          README_CONSTRAINTS_ALL=$(read_report \
            ".github/automation-reports/readme-docs-constraints-report/.github/automation-reports/readme-constraints-report.md" \
            "No ReadMe constraints details artifact found.")
          DEPENDENCY_ALL=$(read_report \
            ".github/automation-reports/dependency-monitor-report/.github/dependency-monitor/dependency-monitor-report.md" \
            "No dependency monitor details artifact found.")

          echo "findings_total=$FINDINGS_TOTAL" >> "$GITHUB_OUTPUT"
          echo "findings_total=$FINDINGS_TOTAL" >> "$GITHUB_ENV"

          {
            echo "LINK_CHECK_ALL<<EOF"
            echo "$LINK_CHECK_ALL"
            echo "EOF"
            echo "MARKDOWNLINT_ALL<<EOF"
            echo "$MARKDOWNLINT_ALL"
            echo "EOF"
            echo "CSPELL_ALL<<EOF"
            echo "$CSPELL_ALL"
            echo "EOF"
            echo "CLI_PATH_ALL<<EOF"
            echo "$CLI_PATH_ALL"
            echo "EOF"
            echo "README_CONSTRAINTS_ALL<<EOF"
            echo "$README_CONSTRAINTS_ALL"
            echo "EOF"
            echo "DEPENDENCY_ALL<<EOF"
            echo "$DEPENDENCY_ALL"
            echo "EOF"
          } >> "$GITHUB_ENV"

          cat > .github/automation-reports/automated-workflow-fixes-summary.md <<EOF
          # Automated Workflow Fixes Summary

          ## Run Context
          - Workflow run: ${RUN_URL}
          - Workflow artifacts: ${RUN_URL}#artifacts
          - Findings total: ${FINDINGS_TOTAL}

          ## Link Check
          - ${REPLACER_SUMMARY}
          - ${REDIRECT_SUMMARY}
          - ${LYCHEE_SUMMARY}
          - Commit: ${LYCHEE_COMMIT_URL}

          ### All Link Check Findings
          ${LINK_CHECK_ALL}

          ## Markdown Lint
          - ${MARKDOWNLINT_SUMMARY}
          - Violations: ${MARKDOWNLINT_VIOLATIONS}
          - Commit: ${MARKDOWNLINT_COMMIT_URL}

          ### All Markdownlint Findings
          ${MARKDOWNLINT_ALL}

          ## Spell Check
          - ${CSPELL_SUMMARY}
          - Commit: ${CSPELL_COMMIT_URL}

          ### All CSpell Findings
          ${CSPELL_ALL}

          ## CLI Command Path Check
          - ${CLI_PATH_SUMMARY}
          - Commit: ${CLI_PATH_COMMIT_URL}

          ### All CLI Command Path Findings
          ${CLI_PATH_ALL}

          ## Secret Scan
          - ${SECRET_SCAN_SUMMARY}

          ## ReadMe Docs Constraints
          - ${README_CONSTRAINTS_SUMMARY}
          - Violations: ${README_VIOLATIONS_TOTAL}

          ### All ReadMe Constraint Findings
          ${README_CONSTRAINTS_ALL}

          ## Dependency Change Monitor
          - ${DEP_SUMMARY}
          - Alert mode: ${DEP_ALERT_MODE}
          - Digest key: ${DEP_DIGEST_KEY}
          - Dedupe label: ${DEP_DEDUPE_LABEL}
          - Jira issue: Created/updated when Jira write is enabled (see dependency-change-monitor logs)

          ### All Dependency Findings
          ${DEPENDENCY_ALL}
          EOF

      - name: Upload aggregated report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: automated-workflow-fixes-summary
          path: .github/automation-reports/automated-workflow-fixes-summary.md

      - name: Create Jira issue (scheduled findings only)
        id: jira
        if: ${{ github.event_name == 'schedule' && steps.aggregate.outputs.findings_total != '0' }}
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPLACER_SUMMARY: ${{ needs.link-check.outputs.replacer_summary }}
          REDIRECT_SUMMARY: ${{ needs.link-check.outputs.redirect_summary }}
          LYCHEE_SUMMARY: ${{ needs.link-check.outputs.lychee_summary }}
          LYCHEE_BROKEN: ${{ needs.link-check.outputs.lychee_broken }}
          LYCHEE_COMMIT_URL: ${{ needs.link-check.outputs.commit_url }}

          MARKDOWNLINT_SUMMARY: ${{ needs.markdownlint.outputs.markdownlint_summary }}
          MARKDOWNLINT_VIOLATIONS: ${{ needs.markdownlint.outputs.markdownlint_violations }}
          MARKDOWNLINT_COMMIT_URL: ${{ needs.markdownlint.outputs.commit_url }}

          CSPELL_SUMMARY: ${{ needs.spell-check.outputs.cspell_summary }}
          CSPELL_ISSUE_COUNT: ${{ needs.spell-check.outputs.cspell_issue_count }}
          CSPELL_TOP5: ${{ needs.spell-check.outputs.cspell_top5 }}
          CSPELL_COMMIT_URL: ${{ needs.spell-check.outputs.commit_url }}

          CLI_PATH_SUMMARY: ${{ needs.cli-path-check.outputs.cli_path_summary }}
          CLI_PATH_FAILURES: ${{ needs.cli-path-check.outputs.cli_path_failures }}
          CLI_PATH_TOP5: ${{ needs.cli-path-check.outputs.cli_path_top5 }}
          CLI_PATH_COMMIT_URL: ${{ needs.cli-path-check.outputs.commit_url }}

          SECRET_SCAN_SUMMARY: ${{ needs.secret-scan.outputs.scan_summary }}
          SECRET_SCAN_LEAKS: ${{ needs.secret-scan.outputs.leaks_found }}
          SECRET_SCAN_RULES: ${{ needs.secret-scan.outputs.rule_breakdown }}

          README_CONSTRAINTS_SUMMARY: ${{ needs.readme-constraints.outputs.constraints_summary }}
          README_VIOLATIONS_TOTAL: ${{ needs.readme-constraints.outputs.violations_total }}

          FINDINGS_TOTAL: ${{ steps.aggregate.outputs.findings_total }}
        run: |
          set -e

          TS="$(date -u +'%Y-%m-%d %H:%M UTC')"
          SUMMARY="Automated Workflow Fixes ${TS} – $GITHUB_REPOSITORY"

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"
          JIRA_CURL_OPTS=(
            --retry 3
            --retry-all-errors
            --retry-delay 2
            --retry-max-time 30
            --connect-timeout 10
            --max-time 45
          )

          ADF_DESC=$(jq -n \
            --arg run "$RUN_URL" \
            --arg artifacts "${RUN_URL}#artifacts" \
            --arg linkBranch "automation/link-check" \
            --arg markdownlintBranch "automation/markdownlint" \
            --arg spellBranch "automation/spell-check" \
            --arg cliBranch "automation/cli-command-path-check" \
            --arg linkCommitUrl "$LYCHEE_COMMIT_URL" \
            --arg markdownlintCommitUrl "$MARKDOWNLINT_COMMIT_URL" \
            --arg spellCommitUrl "$CSPELL_COMMIT_URL" \
            --arg cliCommitUrl "$CLI_PATH_COMMIT_URL" \
            --arg l1 "$REPLACER_SUMMARY" \
            --arg l2 "$REDIRECT_SUMMARY" \
            --arg l3 "$LYCHEE_SUMMARY" \
            --arg l3c "$LYCHEE_BROKEN" \
            --arg m1 "$MARKDOWNLINT_SUMMARY" \
            --arg m2 "$MARKDOWNLINT_VIOLATIONS" \
            --arg s1 "$CSPELL_SUMMARY" \
            --arg s2 "$CSPELL_ISSUE_COUNT" \
            --arg c1 "$CLI_PATH_SUMMARY" \
            --arg c2 "$CLI_PATH_FAILURES" \
            --arg sec1 "$SECRET_SCAN_SUMMARY" \
            --arg sec2 "$SECRET_SCAN_LEAKS" \
            --arg sec3 "$SECRET_SCAN_RULES" \
            --arg rdme1 "$README_CONSTRAINTS_SUMMARY" \
            --arg rdme2 "$README_VIOLATIONS_TOTAL" \
            --arg linkAll "$LINK_CHECK_ALL" \
            --arg markdownAll "$MARKDOWNLINT_ALL" \
            --arg cspellAll "$CSPELL_ALL" \
            --arg cliAll "$CLI_PATH_ALL" \
            --arg readmeAll "$README_CONSTRAINTS_ALL" \
            --arg depAll "$DEPENDENCY_ALL" \
            --arg total "$FINDINGS_TOTAL" \
            'def para($t): {type:"paragraph", content:[{type:"text", text:$t}]};
             def linkPara($label; $url):
               { type:"paragraph", content:[
                   {type:"text", text:$label},
                   {type:"text", text:$url, marks:[{type:"link", attrs:{href:$url}}]}
                 ]};
             def codeBlock($t):
               {type:"codeBlock", attrs:{language:""}, content:[{type:"text", text:$t}]};

             {
               type:"doc", version:1,
               content: [
                 para("Weekly coordinator run for docs automation checks."),
                 linkPara("Workflow run: "; $run),
                 linkPara("Workflow artifacts: "; $artifacts),
                 para("Automation branches used by this workflow:"),
                 para("- Link check: " + $linkBranch + (if ($linkCommitUrl != "") then (" (commit: " + $linkCommitUrl + ")") else "" end)),
                 para("- Markdown lint: " + $markdownlintBranch + (if ($markdownlintCommitUrl != "") then (" (commit: " + $markdownlintCommitUrl + ")") else "" end)),
                 para("- Spell check: " + $spellBranch + (if ($spellCommitUrl != "") then (" (commit: " + $spellCommitUrl + ")") else "" end)),
                 para("- CLI command path check: " + $cliBranch + (if ($cliCommitUrl != "") then (" (commit: " + $cliCommitUrl + ")") else "" end)),
                 para("Total findings: " + $total),
                 para("Link check: " + $l1),
                 para("Link redirects: " + $l2),
                 para("Lychee summary: " + $l3),
                 para("Lychee broken links: " + $l3c),
                 para("All link check findings:"),
                 codeBlock($linkAll),
                 para("Markdown lint: " + $m1),
                 para("Markdown lint violations: " + $m2),
                 para("All markdownlint findings:"),
                 codeBlock($markdownAll),
                 para("CSpell summary: " + $s1),
                 para("CSpell issue count: " + $s2),
                 para("All CSpell findings:"),
                 codeBlock($cspellAll),
                 para("CLI command path summary: " + $c1),
                 para("CLI command path failures: " + $c2),
                 para("All CLI command path findings:"),
                 codeBlock($cliAll),
                 para("Secret scan: " + $sec1),
                 para("Potential leaks found: " + $sec2),
                 (if ($sec3 != "" and $sec3 != "No leaks detected") then para("Rule breakdown: " + $sec3) else empty end),
                 para("ReadMe docs constraints: " + $rdme1),
                 para("ReadMe constraint violations: " + $rdme2),
                 para("All ReadMe constraint findings:"),
                 codeBlock($readmeAll),
                 para("All dependency monitor findings:"),
                 codeBlock($depAll),
                 para("This ticket was created automatically by GitHub Actions.")
               ]
             }')

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY" \
            --argjson adf "$ADF_DESC" \
            '{
              fields: {
                project: { key: $proj },
                summary: $summary,
                description: $adf,
                issuetype: { name: "Task" },
                labels: ["automation","documentation","weekly","workflow-fixes"]
              }
            }')

          RESP=$(curl -sS "${JIRA_CURL_OPTS[@]}" -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          ISSUE_KEY=$(echo "$RESP" | jq -r '.key // empty')

          if [ -z "$ISSUE_KEY" ]; then
            echo "Failed to create Jira issue. Response:"
            echo "$RESP"
            exit 1
          fi

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "Created Jira issue: $ISSUE_KEY"

  notify-on-failure:
    name: Notify Jira on Workflow Failure
    if: failure() && github.event_name == 'schedule'
    needs:
      - aggregate-and-jira
    runs-on: ubuntu-latest
    steps:
      - name: Create Jira failure notification
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TS="$(date -u +'%Y-%m-%d %H:%M UTC')"
          SUMMARY="Workflow failure: ${WORKFLOW_NAME} (${BRANCH}) – ${TS}"

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"
          JIRA_CURL_OPTS=(
            --retry 3
            --retry-all-errors
            --retry-delay 2
            --retry-max-time 30
            --connect-timeout 10
            --max-time 45
          )

          ADF_DESC=$(jq -n \
            --arg workflow "$WORKFLOW_NAME" \
            --arg branch "$BRANCH" \
            --arg run_id "$RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg ts "$TS" \
            'def para($t): {type:"paragraph", content:[{type:"text", text:$t}]};
             def linkPara($label; $url):
               {type:"paragraph", content:[
                 {type:"text", text:$label},
                 {type:"text", text:$url, marks:[{type:"link", attrs:{href:$url}}]}
               ]};
             {
               type:"doc", version:1,
               content:[
                 para("A scheduled GitHub Actions workflow failed and requires investigation."),
                 para("Workflow: " + $workflow),
                 para("Branch: " + $branch),
                 para("Run ID: " + $run_id),
                 para("Timestamp: " + $ts),
                 linkPara("Workflow run URL: "; $run_url),
                 para("This ticket was created automatically because the scheduled run failed.")
               ]
             }')

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY" \
            --argjson adf "$ADF_DESC" \
            '{
              fields: {
                project: {key: $proj},
                summary: $summary,
                description: $adf,
                issuetype: {name: "Task"},
                labels: ["automation","workflow-failure","scheduled"]
              }
            }')

          RESP=$(curl -sS "${JIRA_CURL_OPTS[@]}" -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          ISSUE_KEY=$(echo "$RESP" | jq -r '.key // empty')
          if [ -z "$ISSUE_KEY" ]; then
            echo "Failed to create failure notification Jira issue. Response:"
            echo "$RESP"
            exit 1
          fi

          echo "Created failure notification Jira issue: $ISSUE_KEY"
