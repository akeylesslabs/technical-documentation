name: CLI Command Path Check

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays at 2 AM UTC
  workflow_dispatch:

jobs:
  command-path-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Akeyless CLI
        run: |
          set -e
          curl -sSLo akeyless https://akeyless-cli.s3.us-east-2.amazonaws.com/cli/latest/production/cli-linux-amd64
          chmod +x akeyless
          sudo mv akeyless /usr/local/bin/akeyless
          akeyless --version

      - name: Prepare output directories
        run: |
          mkdir -p .github/cli-command-paths

      - name: Validate command paths
        id: validate
        continue-on-error: true
        run: |
          set +e
          python .github/scripts/check_akeyless_command_paths.py \
            --docs-root docs \
            --out-json .github/cli-command-paths/command-path-check.json \
            --out-md .github/cli-command-paths/command-path-check.md \
            > .github/cli-command-paths/command-path-check.out.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Capture summary
        id: summary
        run: |
          set -e
          if [ -f .github/cli-command-paths/command-path-check.json ]; then
            FAILURE_COUNT=$(jq -r '.failure_count // 0' .github/cli-command-paths/command-path-check.json)
            FILES_SCANNED=$(jq -r '.files_scanned // 0' .github/cli-command-paths/command-path-check.json)
            CHECKED_PATHS=$(jq -r '.checked_command_paths // 0' .github/cli-command-paths/command-path-check.json)
            TOP5=$(jq -r '.failures[:5][] | "\(.file):\(.line) => \(.path)"' .github/cli-command-paths/command-path-check.json)
          else
            FAILURE_COUNT=1
            FILES_SCANNED=0
            CHECKED_PATHS=0
            TOP5="validator did not produce json output"
          fi

          {
            echo "FAILURE_COUNT=$FAILURE_COUNT"
            echo "FILES_SCANNED=$FILES_SCANNED"
            echo "CHECKED_PATHS=$CHECKED_PATHS"
            echo "SUMMARY_TEXT=Scanned $FILES_SCANNED markdown files, checked $CHECKED_PATHS unique command paths, found $FAILURE_COUNT failures"
            echo "TOP5<<EOF"
            echo "$TOP5"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Commit reports
        if: always()
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="automation/cli-command-path-check"
          git fetch origin
          git checkout -B $BRANCH

          git add .github/cli-command-paths/command-path-check.json || true
          git add .github/cli-command-paths/command-path-check.md || true
          git add .github/cli-command-paths/command-path-check.out.txt || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update cli command path check report [skip ci]"
            git push origin $BRANCH --force
          fi

      - name: Get commit URL
        id: commiturl
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create Jira issue
        id: jira
        if: always() && (env.FAILURE_COUNT || '0') != '0'
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: automation/cli-command-path-check
          COMMIT_URL: ${{ steps.commiturl.outputs.url }}
          SUMMARY_TEXT: ${{ env.SUMMARY_TEXT }}
          FAILURE_COUNT: ${{ env.FAILURE_COUNT }}
          TOP5: ${{ env.TOP5 }}
        run: |
          set -e

          TS="$(date -u +'%Y-%m-%d %H:%M UTC')"
          SUMMARY="CLI command path check ${TS} – $GITHUB_REPOSITORY@$BRANCH_NAME"

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"

          ADF_DESC=$(jq -n \
            --arg run "$RUN_URL" \
            --arg br "$BRANCH_NAME" \
            --arg commit "$COMMIT_URL" \
            --arg summary "$SUMMARY_TEXT" \
            --arg failures "$FAILURE_COUNT" \
            --arg top5 "$TOP5" \
            'def para($t): {type:"paragraph", content:[{type:"text", text:$t}]};
             def linkPara($label; $url):
               { type:"paragraph", content:[
                   {type:"text", text:$label},
                   {type:"text", text:$url, marks:[{type:"link", attrs:{href:$url}}]}
                 ]};
             def bulletItems($lines):
               if ($lines | length) == 0 then
                 []
               else
                 ($lines | map({
                   type:"listItem",
                   content:[{type:"paragraph", content:[{type:"text", text:.}]}]
                 }))
               end;

             {
               type:"doc", version:1,
               content: (
                 [
                   para("Automated weekly validation of akeyless command paths in docs code blocks."),
                   linkPara("Workflow run: "; $run),
                   para("Branch: " + $br),
                   linkPara("Commit: "; $commit),
                   para("Summary: " + $summary),
                   para("Failure count: " + $failures),
                   para("Top failures:")
                 ]
                 +
                 (if ($top5 | length) > 0 then
                    [
                      {
                        type:"bulletList",
                        content: bulletItems(($top5 | split("\n") | map(select(length>0))))
                      }
                    ]
                  else
                    [ para("No failure details available.") ]
                  end)
                 +
                 [
                   para("Artifacts attached:"),
                   {
                     type:"bulletList",
                     content:[
                       {type:"listItem", content:[{type:"paragraph", content:[{type:"text", text:".github/cli-command-paths/command-path-check.json"}]}]},
                       {type:"listItem", content:[{type:"paragraph", content:[{type:"text", text:".github/cli-command-paths/command-path-check.md"}]}]},
                       {type:"listItem", content:[{type:"paragraph", content:[{type:"text", text:".github/cli-command-paths/command-path-check.out.txt"}]}]}
                     ]
                   },
                   para("This ticket was created automatically by GitHub Actions.")
                 ]
               )
             }')

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY" \
            --argjson adf "$ADF_DESC" \
            '{
              fields: {
                project: { key: $proj },
                summary: $summary,
                description: $adf,
                issuetype: { name: "Task" },
                labels: ["cli-command-paths","automation","documentation"]
              }
            }')

          RESP=$(curl -sS -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          ISSUE_KEY=$(echo "$RESP" | jq -r '.key // empty')
          ISSUE_ID=$(echo "$RESP" | jq -r '.id // empty')

          if [ -z "$ISSUE_KEY" ]; then
            echo "Failed to create Jira issue. Response:"
            echo "$RESP"
            exit 1
          fi

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "Created Jira issue: $ISSUE_KEY"

      - name: Attach artifacts to Jira issue
        if: steps.jira.outputs.issue_key != ''
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          set -e
          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"

          attach_file () {
            local fpath="$1"
            if [ -f "$fpath" ]; then
              echo "Attaching $fpath to $ISSUE_KEY"
              curl -sS -X POST \
                -H "$AUTH_HEADER" \
                -H "X-Atlassian-Token: no-check" \
                -F "file=@${fpath}" \
                "$JIRA_BASE_URL/rest/api/3/issue/${ISSUE_KEY}/attachments" >/dev/null
            else
              echo "File not found: $fpath (skipping)"
            fi
          }

          attach_file ".github/cli-command-paths/command-path-check.json"
          attach_file ".github/cli-command-paths/command-path-check.md"
          attach_file ".github/cli-command-paths/command-path-check.out.txt"
