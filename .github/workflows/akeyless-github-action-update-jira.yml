name: Akeyless Public Repos Update Jira Tasks

permissions:
  contents: read

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  check-repo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo_full:
          - akeyless-community/Akeyless-Cursor-Plugin
          - akeyless-community/AkeylessCredentialsProvider
          - akeyless-community/N8N_PlugIn
          - akeyless-community/akeyless-action
          - akeyless-community/akeyless-cert-manager-issuer
          - akeyless-community/akeyless-connectivity-check
          - akeyless-community/akeyless-custom-server-kustomize-patches
          - akeyless-community/akeyless-custom-server-ui-rotate
          - akeyless-community/akeyless-custom-server-w-puppeteer
          - akeyless-community/akeyless-dba-workflow-tf-example
          - akeyless-community/akeyless-eso-webhook-trigger
          - akeyless-community/akeyless-gateway-migrator
          - akeyless-community/akeyless-github-action
          - akeyless-community/akeyless-instruqt-learners-terraform
          - akeyless-community/akeyless-k8s-auth-examples
          - akeyless-community/akeyless-k8s-auth-terraform
          - akeyless-community/akeyless-mcp-plugin
          - akeyless-community/akeyless-nu-shell-examples
          - akeyless-community/akeyless-oidc-identity-provider-example
          - akeyless-community/akeyless-openapi-spec-extractor
          - akeyless-community/akeyless-openldap-ldif-star-trek
          - akeyless-community/akeyless-serverless-gateway
          - akeyless-community/akeyless-sheller
          - akeyless-community/akeyless-tf-cloud-docker-agent
          - akeyless-community/akeyless-tf-cloud-intro
          - akeyless-community/akeyless-ui-webhook-builder
          - akeyless-community/awx-plugins
          - akeyless-community/custom-server-ui-payload-generator
          - akeyless-community/dapr
          - akeyless-community/dapr-docs
          - akeyless-community/example-java-sdk-encryption-as-a-service
          - akeyless-community/external-secrets
          - akeyless-community/heimdal
          - akeyless-community/homebrew-agmigrator
          - akeyless-community/homebrew-kav
          - akeyless-community/idp-demo
          - akeyless-community/json-secret-importer
          - akeyless-community/k8s-auth-validator
          - akeyless-community/keda-docs
          - akeyless-community/mock-authentication
          - akeyless-community/network-diagram-generator
          - akeyless-community/openshift-helmchart
          - akeyless-community/sra-demo-environment
          - akeyless-community/ssh-target
          - akeyless-community/steampipe-plugin-akeyless
          - akeyless-community/support-bundle
          - akeyless-community/teamcity-akeyless-plugin
          - akeyless-community/terraform-cloud-gha-secrets
          - akeyless-community/terraform-provider-akeyless
          - akeylesslabs/DAPR-components
          - akeylesslabs/adminer
          - akeylesslabs/akeyless-csharp-netcore
          - akeylesslabs/akeyless-csi-provider
          - akeylesslabs/akeyless-funnel
          - akeylesslabs/akeyless-go
          - akeylesslabs/akeyless-go-cloud-id
          - akeylesslabs/akeyless-go-test
          - akeylesslabs/akeyless-grpc-go
          - akeylesslabs/akeyless-grpc-php
          - akeylesslabs/akeyless-grpc-rust
          - akeylesslabs/akeyless-java
          - akeylesslabs/akeyless-java-cloud-id
          - akeylesslabs/akeyless-java-cloud-id-lightweight
          - akeylesslabs/akeyless-javascript
          - akeylesslabs/akeyless-js-cloud-id
          - akeylesslabs/akeyless-minio
          - akeylesslabs/akeyless-netcore-cloud-id
          - akeylesslabs/akeyless-python
          - akeylesslabs/akeyless-ruby
          - akeylesslabs/akeyless-ruby-sdk
          - akeylesslabs/akeyless-servicenow-credential-resolver
          - akeylesslabs/ansible-ui
          - akeylesslabs/awx
          - akeylesslabs/cli
          - akeylesslabs/custom-producer
          - akeylesslabs/docker-compose
          - akeylesslabs/go-kmip
          - akeylesslabs/go-socks5
          - akeylesslabs/golang-openssl-wrapper
          - akeylesslabs/helm-charts
          - akeylesslabs/homebrew-tap
          - akeylesslabs/jwt-go
          - akeylesslabs/keda
          - akeylesslabs/openssl
          - akeylesslabs/openssl-c
          - akeylesslabs/sigstore
          - akeylesslabs/sshproxy
          - akeylesslabs/trufflehog

    steps:
      - name: Get latest upstream release tag
        id: detect
        run: |
          set -euo pipefail

          RELEASE_API_URL="https://api.github.com/repos/${{ matrix.repo_full }}/releases/latest"
          RELEASE_RESP_BODY=$(mktemp)

          RELEASE_HTTP_CODE=$(curl -sS -o "$RELEASE_RESP_BODY" -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$RELEASE_API_URL")

          if [ "$RELEASE_HTTP_CODE" != "200" ] && [ "$RELEASE_HTTP_CODE" != "404" ]; then
            echo "GitHub API request failed for $RELEASE_API_URL with HTTP $RELEASE_HTTP_CODE"
            cat "$RELEASE_RESP_BODY"
            exit 1
          fi

          LATEST_TAG=""
          if [ "$RELEASE_HTTP_CODE" = "200" ]; then
            LATEST_TAG=$(jq -r '.tag_name // empty' "$RELEASE_RESP_BODY")
          fi

          if [ -n "$LATEST_TAG" ]; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "Detected latest release tag from releases API: $LATEST_TAG"
            exit 0
          fi

          TAGS_API_URL="https://api.github.com/repos/${{ matrix.repo_full }}/tags?per_page=100"
          TAGS_RESP_BODY=$(mktemp)

          TAGS_HTTP_CODE=$(curl -sS -o "$TAGS_RESP_BODY" -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$TAGS_API_URL")

          if [ "$TAGS_HTTP_CODE" = "200" ]; then
            set +e
            SEMVER_TAG=$(jq -r '.[].name // empty' "$TAGS_RESP_BODY" \
              | grep -E '^[vV]?[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z.-]+)?$' \
              | sort -V \
              | tail -n1)
            set -e

            if [ -n "$SEMVER_TAG" ]; then
              LATEST_TAG="$SEMVER_TAG"
            else
              LATEST_TAG=$(jq -r '.[0].name // empty' "$TAGS_RESP_BODY")
            fi
          elif [ "$TAGS_HTTP_CODE" != "404" ]; then
            echo "GitHub API request failed for $TAGS_API_URL with HTTP $TAGS_HTTP_CODE"
            cat "$TAGS_RESP_BODY"
            exit 1
          fi

          if [ -z "$LATEST_TAG" ]; then
            echo "No releases or tags found for ${{ matrix.repo_full }}. Skipping."
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_release=true" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Detected latest tag from tags API fallback: $LATEST_TAG"

      - name: Create Jira issue for new release (${{ matrix.repo_full }})
        id: jira
        if: steps.detect.outputs.has_release == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
          REPO_FULL: ${{ matrix.repo_full }}
          LATEST_TAG: ${{ steps.detect.outputs.latest_tag }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e

          REPO_DISPLAY="${REPO_FULL}"
          SUMMARY_PREFIX="${REPO_DISPLAY} upstream update detected:"
          SUMMARY="${SUMMARY_PREFIX} latest ${LATEST_TAG}"

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"
          JIRA_CURL_OPTS=(
            --retry 3
            --retry-all-errors
            --retry-delay 2
            --retry-max-time 30
            --connect-timeout 10
            --max-time 45
          )

          SEARCH_JQL=$(jq -rn \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg prefix "$SUMMARY_PREFIX" \
            --arg tag "$LATEST_TAG" \
            '$proj + " AND summary ~ " + "\"" + $prefix + "\"" + " AND summary ~ " + "\"" + $tag + "\""')

          SEARCH_RESP=$(curl -sS "${JIRA_CURL_OPTS[@]}" \
            -G \
            -H "$AUTH_HEADER" \
            --data-urlencode "jql=${SEARCH_JQL}" \
            --data-urlencode "maxResults=1" \
            "$JIRA_BASE_URL/rest/api/3/search")

          EXISTING_KEY=$(echo "$SEARCH_RESP" | jq -r '.issues[0].key // empty')
          EXISTING_ID=$(echo "$SEARCH_RESP" | jq -r '.issues[0].id // empty')

          if [ -n "$EXISTING_KEY" ]; then
            echo "issue_key=$EXISTING_KEY" >> "$GITHUB_OUTPUT"
            echo "issue_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
            echo "Jira issue already exists for latest tag $LATEST_TAG: $EXISTING_KEY"
            exit 0
          fi

          LABEL_SLUG=$(echo "$REPO_FULL" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | sed 's/-*$//')

          ADF_DESC=$(jq -n \
            --arg repo_display "$REPO_DISPLAY" \
            --arg latest "$LATEST_TAG" \
            --arg run_url "$RUN_URL" \
            'def para($t): {type:"paragraph", content:[{type:"text", text:$t}]};
             def linkPara($label; $url):
               { type:"paragraph", content:[
                   {type:"text", text:$label},
                   {type:"text", text:$url, marks:[{type:"link", attrs:{href:$url}}]}
                 ]};

             {
               type:"doc", version:1,
               content:[
                 para("A new release was detected for " + $repo_display + "."),
                 para("Latest upstream tag: " + $latest),
                 para("Repository: " + $repo_display),
                 linkPara("Workflow run URL: "; $run_url),
                 para("This ticket was created automatically by GitHub Actions for documentation triage.")
               ]
             }')

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY" \
            --argjson adf "$ADF_DESC" \
            --arg label_slug "$LABEL_SLUG" \
            '{
              fields: {
                project: { key: $proj },
                summary: $summary,
                description: $adf,
                issuetype: { name: "Task" },
                labels: ["documentation","akeyless-public-repos",$label_slug,"scheduled"]
              }
            }')

          RESP=$(curl -sS "${JIRA_CURL_OPTS[@]}" -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          ISSUE_KEY=$(echo "$RESP" | jq -r '.key // empty')
          ISSUE_ID=$(echo "$RESP" | jq -r '.id // empty')

          if [ -z "$ISSUE_KEY" ]; then
            echo "Failed to create Jira issue. Response:"
            echo "$RESP"
            exit 1
          fi

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "Created Jira issue: $ISSUE_KEY"
