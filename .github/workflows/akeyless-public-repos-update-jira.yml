name: Akeyless Public Repos Update Jira Tasks

permissions:
  contents: read

on:
  schedule:
    - cron: "15 2 * * 1"
  workflow_dispatch:
    inputs:
      scope_org:
        description: Repo owner scope (all, akeyless-community, akeylesslabs)
        required: false
        default: all
        type: choice
        options:
          - all
          - akeyless-community
          - akeylesslabs
      include_pattern:
        description: Regex to include matching full repo slugs (owner/repo)
        required: false
        default: ".*"
        type: string
      exclude_pattern:
        description: Regex to exclude matching full repo slugs (owner/repo)
        required: false
        default: "^$"
        type: string
      specific_repos:
        description: Optional comma-separated full repo slugs to include
        required: false
        default: ""
        type: string
      include_prereleases:
        description: Include prerelease versions when detecting latest signal
        required: false
        default: false
        type: boolean
      create_head_commit_subtasks:
        description: Create Jira subtasks for head commit fallback signals on quarterly manual runs only (Jan, Apr, Jul, Oct)
        required: false
        default: false
        type: boolean
      dry_run:
        description: Do not create Jira issues; only report what would happen
        required: false
        default: false
        type: boolean
      soft_fail_classes:
        description: Comma-separated failure classes to soft-fail
        required: false
        default: "no_signal,api_transient"
        type: string
      retry_count:
        description: Retry count for GitHub/Jira API calls
        required: false
        default: "3"
        type: string
      max_parallel:
        description: Maximum parallel matrix jobs
        required: false
        default: "20"
        type: string
      include_third_party_repos:
        description: Include repos from third_party_repos in tracked repo file
        required: false
        default: false
        type: boolean

jobs:
  load-repo-list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      repo_count: ${{ steps.build.outputs.repo_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build matrix from tracked repo file
        id: build
        run: |
          set -euo pipefail

          REPO_FILE=".github/workflows/data/public-repos-to-track.json"
          if [ ! -f "$REPO_FILE" ]; then
            echo "Tracked repo file not found: $REPO_FILE"
            exit 1
          fi

          INCLUDE_THIRD_PARTY="${{ github.event_name == 'workflow_dispatch' && inputs.include_third_party_repos && 'true' || 'false' }}"

          SELECTED_REPOS=$(jq -c --arg include_third_party "$INCLUDE_THIRD_PARTY" '
            if $include_third_party == "true" then
              (.repos + (.third_party_repos // [])) | unique
            else
              .repos
            end
          ' "$REPO_FILE")

          REPO_COUNT=$(jq -r 'length' <<< "$SELECTED_REPOS")
          if [ "$REPO_COUNT" -le 0 ]; then
            echo "Tracked repo list is empty in $REPO_FILE"
            exit 1
          fi

          MATRIX=$(jq -cn --argjson repos "$SELECTED_REPOS" '{ repo_full: $repos }')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "repo_count=$REPO_COUNT" >> "$GITHUB_OUTPUT"

  create-run-summary-task:
    needs: load-repo-list
    runs-on: ubuntu-latest
    outputs:
      summary_issue_key: ${{ steps.summary.outputs.summary_issue_key }}
      summary_issue_id: ${{ steps.summary.outputs.summary_issue_id }}
      subtask_issue_type_name: ${{ steps.summary.outputs.subtask_issue_type_name }}
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      RETRY_COUNT: ${{ inputs.retry_count || '3' }}
      JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REPO_COUNT: ${{ needs.load-repo-list.outputs.repo_count }}
    steps:
      - name: Create or resolve run summary Jira task
        id: summary
        run: |
          set -euo pipefail

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry-run mode enabled. Skipping run summary Jira task creation."
            echo "summary_issue_key=" >> "$GITHUB_OUTPUT"
            echo "summary_issue_id=" >> "$GITHUB_OUTPUT"
            echo "subtask_issue_type_name=Sub-task" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          capture_error_snippet() {
            local file_path="$1"
            tr '\n' ' ' < "$file_path" | sed 's/[[:space:]]\+/ /g' | cut -c1-300
          }

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"
          JIRA_CURL_OPTS=(
            --retry "$RETRY_COUNT"
            --retry-all-errors
            --retry-delay 2
            --retry-max-time 60
            --connect-timeout 10
            --max-time 45
          )

          SUBTASK_TYPE_NAME="Sub-task"
          ISSUETYPE_RESP_BODY=$(mktemp)
          ISSUETYPE_HTTP_CODE=$(curl -sS -o "$ISSUETYPE_RESP_BODY" -w "%{http_code}" "${JIRA_CURL_OPTS[@]}" \
            -H "$AUTH_HEADER" \
            "$JIRA_BASE_URL/rest/api/3/project/${JIRA_PROJECT_KEY}")

          if [ "$ISSUETYPE_HTTP_CODE" = "200" ]; then
            RESOLVED_SUBTASK=$(jq -r '[.issueTypes[]? | select(.subtask == true) | .name] | first // empty' "$ISSUETYPE_RESP_BODY")
            if [ -n "$RESOLVED_SUBTASK" ]; then
              SUBTASK_TYPE_NAME="$RESOLVED_SUBTASK"
            fi
          else
            echo "Unable to resolve project issue types. Using default subtask type: $SUBTASK_TYPE_NAME"
            cat "$ISSUETYPE_RESP_BODY"
          fi

          echo "subtask_issue_type_name=$SUBTASK_TYPE_NAME" >> "$GITHUB_OUTPUT"

          RUN_LABEL="ak-upd-run-${GITHUB_RUN_ID}"
          SUMMARY_TITLE="Public repos update run ${GITHUB_RUN_ID} (${GITHUB_REF_NAME})"

          SUMMARY_ADF=$(jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "$RUN_URL" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg repo_count "$REPO_COUNT" \
            'def para($t): {type:"paragraph", content:[{type:"text", text:$t}]};
             def linkPara($label; $url):
               { type:"paragraph", content:[
                   {type:"text", text:$label},
                   {type:"text", text:$url, marks:[{type:"link", attrs:{href:$url}}]}
                 ]};

             {
               type:"doc", version:1,
               content:[
                 para("Automated public repository scan run summary."),
                 para("Run ID: " + $run_id + ", attempt: " + $run_attempt),
                 para("Branch: " + $branch),
                 para("Event: " + $event_name),
                 para("Repositories evaluated: " + $repo_count),
                 linkPara("Workflow run URL: "; $run_url)
               ]
             }')

          SEARCH_JQL=$(jq -rn \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg run_label "$RUN_LABEL" \
            '"project = " + $proj + " AND labels = " + "\"" + $run_label + "\""')

          SEARCH_RESP_BODY=$(mktemp)
          SEARCH_HTTP_CODE=$(curl -sS -o "$SEARCH_RESP_BODY" -w "%{http_code}" "${JIRA_CURL_OPTS[@]}" \
            -G \
            -H "$AUTH_HEADER" \
            --data-urlencode "jql=${SEARCH_JQL}" \
            --data-urlencode "maxResults=1" \
            "$JIRA_BASE_URL/rest/api/3/search/jql")

          if [ "$SEARCH_HTTP_CODE" != "200" ]; then
            echo "Failed to search for run summary Jira task. HTTP $SEARCH_HTTP_CODE"
            cat "$SEARCH_RESP_BODY"
            exit 1
          fi

          EXISTING_KEY=$(jq -r '.issues[0].key // empty' "$SEARCH_RESP_BODY")
          EXISTING_ID=$(jq -r '.issues[0].id // empty' "$SEARCH_RESP_BODY")
          if [ -n "$EXISTING_KEY" ] && [ -n "$EXISTING_ID" ]; then
            echo "summary_issue_key=$EXISTING_KEY" >> "$GITHUB_OUTPUT"
            echo "summary_issue_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
            echo "Reusing existing run summary Jira task: $EXISTING_KEY"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY_TITLE" \
            --argjson adf "$SUMMARY_ADF" \
            --arg run_label "$RUN_LABEL" \
            '{
              fields: {
                project: { key: $proj },
                summary: $summary,
                description: $adf,
                issuetype: { name: "Task" },
                labels: ["documentation","akeyless-public-repos","scheduled",$run_label]
              }
            }')

          CREATE_RESP_BODY=$(mktemp)
          CREATE_HTTP_CODE=$(curl -sS -o "$CREATE_RESP_BODY" -w "%{http_code}" "${JIRA_CURL_OPTS[@]}" -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          if [ "$CREATE_HTTP_CODE" != "201" ]; then
            echo "Failed to create run summary Jira task. HTTP $CREATE_HTTP_CODE"
            cat "$CREATE_RESP_BODY"
            exit 1
          fi

          SUMMARY_ISSUE_KEY=$(jq -r '.key // empty' "$CREATE_RESP_BODY")
          SUMMARY_ISSUE_ID=$(jq -r '.id // empty' "$CREATE_RESP_BODY")

          if [ -z "$SUMMARY_ISSUE_KEY" ] || [ -z "$SUMMARY_ISSUE_ID" ]; then
            echo "Run summary Jira task created but key/id could not be parsed."
            cat "$CREATE_RESP_BODY"
            exit 1
          fi

          echo "summary_issue_key=$SUMMARY_ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "summary_issue_id=$SUMMARY_ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "Created run summary Jira task: $SUMMARY_ISSUE_KEY"

  check-repo:
    needs:
      - load-repo-list
      - create-run-summary-task
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SCOPE_ORG: ${{ inputs.scope_org || 'all' }}
      INCLUDE_PATTERN: ${{ inputs.include_pattern || '.*' }}
      EXCLUDE_PATTERN: ${{ inputs.exclude_pattern || '^$' }}
      SPECIFIC_REPOS: ${{ inputs.specific_repos || '' }}
      INCLUDE_PRERELEASES: ${{ inputs.include_prereleases && 'true' || 'false' }}
      CREATE_HEAD_COMMIT_SUBTASKS: ${{ inputs.create_head_commit_subtasks && 'true' || 'false' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      SOFT_FAIL_CLASSES: ${{ inputs.soft_fail_classes || 'no_signal,api_transient' }}
      RETRY_COUNT: ${{ inputs.retry_count || '3' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '20') }}
      matrix: ${{ fromJSON(needs.load-repo-list.outputs.matrix) }}

    steps:
      - name: Apply scope controls
        id: scope
        run: |
          set -euo pipefail

          REPO_FULL="${{ matrix.repo_full }}"
          REPO_OWNER="${REPO_FULL%%/*}"
          IN_SCOPE=true

          if [ "$SCOPE_ORG" != "all" ] && [ "$REPO_OWNER" != "$SCOPE_ORG" ]; then
            IN_SCOPE=false
          fi

          if [ "$IN_SCOPE" = true ] && [ -n "$SPECIFIC_REPOS" ]; then
            MATCHED=false
            IFS=',' read -ra REPOS_ARR <<< "$SPECIFIC_REPOS"
            for r in "${REPOS_ARR[@]}"; do
              r_trimmed="$(echo "$r" | xargs)"
              if [ "$r_trimmed" = "$REPO_FULL" ]; then
                MATCHED=true
                break
              fi
            done
            if [ "$MATCHED" = false ]; then
              IN_SCOPE=false
            fi
          fi

          if [ "$IN_SCOPE" = true ] && ! echo "$REPO_FULL" | grep -Eq "$INCLUDE_PATTERN"; then
            IN_SCOPE=false
          fi

          if [ "$IN_SCOPE" = true ] && echo "$REPO_FULL" | grep -Eq "$EXCLUDE_PATTERN"; then
            IN_SCOPE=false
          fi

          echo "in_scope=$IN_SCOPE" >> "$GITHUB_OUTPUT"

      - name: Apply head-commit cadence guard
        id: cadence
        run: |
          set -euo pipefail

          EFFECTIVE_CREATE_HEAD_COMMIT_SUBTASKS="$CREATE_HEAD_COMMIT_SUBTASKS"

          if [ "$CREATE_HEAD_COMMIT_SUBTASKS" = "true" ]; then
            CURRENT_MONTH="$(date -u +%m)"
            case "$CURRENT_MONTH" in
              01|04|07|10)
                echo "Quarterly head-commit subtask window is open for month $CURRENT_MONTH."
                ;;
              *)
                EFFECTIVE_CREATE_HEAD_COMMIT_SUBTASKS="false"
                echo "create_head_commit_subtasks is ignored outside the quarterly window (Jan, Apr, Jul, Oct)."
                ;;
            esac
          fi

          echo "effective_create_head_commit_subtasks=$EFFECTIVE_CREATE_HEAD_COMMIT_SUBTASKS" >> "$GITHUB_OUTPUT"

      - name: Get latest upstream release tag
        id: detect
        if: steps.scope.outputs.in_scope == 'true'
        run: |
          set -euo pipefail

          is_soft_fail_class() {
            local class_name="$1"
            echo ",$SOFT_FAIL_CLASSES," | grep -Eq ",${class_name},"
          }

          gh_curl() {
            local url="$1"
            local body_out="$2"
            curl -sS -o "$body_out" -w "%{http_code}" \
              --retry "$RETRY_COUNT" \
              --retry-all-errors \
              --retry-delay 2 \
              --retry-max-time 60 \
              --connect-timeout 10 \
              --max-time 45 \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "$url"
          }

          RELEASE_API_URL="https://api.github.com/repos/${{ matrix.repo_full }}/releases/latest"
          RELEASE_RESP_BODY=$(mktemp)

          RELEASE_HTTP_CODE=$(gh_curl "$RELEASE_API_URL" "$RELEASE_RESP_BODY")

          if [ "$RELEASE_HTTP_CODE" != "200" ] && [ "$RELEASE_HTTP_CODE" != "404" ]; then
            echo "GitHub API request failed for $RELEASE_API_URL with HTTP $RELEASE_HTTP_CODE"
            cat "$RELEASE_RESP_BODY"
            echo "failure_class=api_transient" >> "$GITHUB_OUTPUT"
            if is_soft_fail_class "api_transient"; then
              echo "has_signal=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi

          LATEST_TAG=""
          if [ "$RELEASE_HTTP_CODE" = "200" ]; then
            LATEST_TAG=$(jq -r '.tag_name // empty' "$RELEASE_RESP_BODY")
            IS_PRERELEASE=$(jq -r '.prerelease // false' "$RELEASE_RESP_BODY")

            if [ -n "$LATEST_TAG" ] && [ "$INCLUDE_PRERELEASES" != "true" ] && [ "$IS_PRERELEASE" = "true" ]; then
              LATEST_TAG=""
            fi
          fi

          if [ -n "$LATEST_TAG" ]; then
            echo "has_signal=true" >> "$GITHUB_OUTPUT"
            echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
            echo "signal_source=release" >> "$GITHUB_OUTPUT"
            echo "Detected latest release tag from releases API: $LATEST_TAG"
            exit 0
          fi

          TAGS_API_URL="https://api.github.com/repos/${{ matrix.repo_full }}/tags?per_page=100"
          TAGS_RESP_BODY=$(mktemp)

          TAGS_HTTP_CODE=$(gh_curl "$TAGS_API_URL" "$TAGS_RESP_BODY")

          if [ "$TAGS_HTTP_CODE" = "200" ]; then
            TAG_NAMES=$(jq -r '.[].name // empty' "$TAGS_RESP_BODY")

            FILTERED_TAGS="$TAG_NAMES"
            if [ "$INCLUDE_PRERELEASES" != "true" ]; then
              FILTERED_TAGS=$(echo "$TAG_NAMES" | grep -Eiv '(alpha|beta|rc|preview|pre|snapshot)' || true)
            fi

            SEMVER_TAG=$(echo "$FILTERED_TAGS" | grep -E '^[vV]?[0-9]+(\.[0-9]+){1,3}([.-][0-9A-Za-z.-]+)?$' | head -n1 || true)
            if [ -n "$SEMVER_TAG" ]; then
              LATEST_TAG="$SEMVER_TAG"
            else
              LATEST_TAG=$(echo "$FILTERED_TAGS" | head -n1 || true)
            fi
          elif [ "$TAGS_HTTP_CODE" != "404" ]; then
            echo "GitHub API request failed for $TAGS_API_URL with HTTP $TAGS_HTTP_CODE"
            cat "$TAGS_RESP_BODY"
            echo "failure_class=api_transient" >> "$GITHUB_OUTPUT"
            if is_soft_fail_class "api_transient"; then
              echo "has_signal=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi

          if [ -z "$LATEST_TAG" ]; then
            REPO_API_URL="https://api.github.com/repos/${{ matrix.repo_full }}"
            REPO_RESP_BODY=$(mktemp)

            REPO_HTTP_CODE=$(gh_curl "$REPO_API_URL" "$REPO_RESP_BODY")

            if [ "$REPO_HTTP_CODE" != "200" ]; then
              echo "GitHub API request failed for $REPO_API_URL with HTTP $REPO_HTTP_CODE"
              cat "$REPO_RESP_BODY"
              echo "failure_class=api_transient" >> "$GITHUB_OUTPUT"
              if is_soft_fail_class "api_transient"; then
                echo "has_signal=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              exit 1
            fi

            DEFAULT_BRANCH=$(jq -r '.default_branch // empty' "$REPO_RESP_BODY")
            if [ -n "$DEFAULT_BRANCH" ]; then
              COMMIT_API_URL="https://api.github.com/repos/${{ matrix.repo_full }}/commits/${DEFAULT_BRANCH}"
              COMMIT_RESP_BODY=$(mktemp)
              COMMIT_HTTP_CODE=$(gh_curl "$COMMIT_API_URL" "$COMMIT_RESP_BODY")

              if [ "$COMMIT_HTTP_CODE" = "200" ]; then
                HEAD_SHA=$(jq -r '.sha // empty' "$COMMIT_RESP_BODY")
                if [ -n "$HEAD_SHA" ]; then
                  SHORT_SHA=$(echo "$HEAD_SHA" | cut -c1-12)
                  LATEST_TAG="head:${SHORT_SHA}"
                  echo "has_signal=true" >> "$GITHUB_OUTPUT"
                  echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
                  echo "signal_source=head_commit" >> "$GITHUB_OUTPUT"
                  echo "Detected default branch head commit fallback signal: $LATEST_TAG"
                  exit 0
                fi
              elif [ "$COMMIT_HTTP_CODE" != "404" ]; then
                echo "GitHub API request failed for $COMMIT_API_URL with HTTP $COMMIT_HTTP_CODE"
                cat "$COMMIT_RESP_BODY"
                echo "failure_class=api_transient" >> "$GITHUB_OUTPUT"
                if is_soft_fail_class "api_transient"; then
                  echo "has_signal=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                exit 1
              fi
            fi

            echo "No releases, tags, or default-branch head commit signal found for ${{ matrix.repo_full }}. Skipping."
            echo "failure_class=no_signal" >> "$GITHUB_OUTPUT"
            echo "has_signal=false" >> "$GITHUB_OUTPUT"
            if is_soft_fail_class "no_signal"; then
              exit 0
            fi
            exit 0
          fi

          echo "has_signal=true" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "signal_source=tag" >> "$GITHUB_OUTPUT"
          echo "Detected latest tag from tags API fallback: $LATEST_TAG"

      - name: Create Jira issue for new release (${{ matrix.repo_full }})
        id: jira
        if: steps.scope.outputs.in_scope == 'true' && steps.detect.outputs.has_signal == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
          SUMMARY_ISSUE_ID: ${{ needs.create-run-summary-task.outputs.summary_issue_id }}
          SUMMARY_ISSUE_KEY: ${{ needs.create-run-summary-task.outputs.summary_issue_key }}
          SUBTASK_ISSUE_TYPE_NAME: ${{ needs.create-run-summary-task.outputs.subtask_issue_type_name || 'Sub-task' }}
          REPO_FULL: ${{ matrix.repo_full }}
          LATEST_TAG: ${{ steps.detect.outputs.latest_tag }}
          SIGNAL_SOURCE: ${{ steps.detect.outputs.signal_source }}
          CREATE_HEAD_COMMIT_SUBTASKS: ${{ steps.cadence.outputs.effective_create_head_commit_subtasks || 'false' }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e

          is_soft_fail_class() {
            local class_name="$1"
            echo ",$SOFT_FAIL_CLASSES," | grep -Eq ",${class_name},"
          }

          capture_error_snippet() {
            local file_path="$1"
            tr '\n' ' ' < "$file_path" | sed 's/[[:space:]]\+/ /g' | cut -c1-300
          }

          REPO_DISPLAY="${REPO_FULL}"
          SUMMARY_PREFIX="${REPO_DISPLAY} upstream update detected:"
          SUMMARY="${SUMMARY_PREFIX} latest ${LATEST_TAG}"
          DEDUPE_KEY=$(printf "%s|%s" "$REPO_FULL" "$LATEST_TAG" | sha256sum | awk '{print $1}' | cut -c1-20)
          DEDUPE_LABEL="ak-upd-${DEDUPE_KEY}"

          echo "dedupe_label=$DEDUPE_LABEL" >> "$GITHUB_OUTPUT"

          if [ "$DRY_RUN" = "true" ]; then
            echo "action=dry_run" >> "$GITHUB_OUTPUT"
            echo "Dry-run mode enabled. Would create issue for ${REPO_FULL} @ ${LATEST_TAG}."
            exit 0
          fi

          if [ -z "$SUMMARY_ISSUE_ID" ]; then
            echo "Missing run summary Jira issue ID for subtask creation."
            exit 1
          fi

          if [ "$SIGNAL_SOURCE" = "head_commit" ] && [ "$CREATE_HEAD_COMMIT_SUBTASKS" != "true" ]; then
            echo "action=skipped_head_commit" >> "$GITHUB_OUTPUT"
            echo "Skipping Jira issue creation for head commit fallback signal: ${REPO_FULL} @ ${LATEST_TAG}"
            exit 0
          fi

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"
          JIRA_CURL_OPTS=(
            --retry "$RETRY_COUNT"
            --retry-all-errors
            --retry-delay 2
            --retry-max-time 60
            --connect-timeout 10
            --max-time 45
          )

          SEARCH_JQL=$(jq -rn \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg dedupe_label "$DEDUPE_LABEL" \
            '"project = " + $proj + " AND labels = " + "\"" + $dedupe_label + "\""')

          SEARCH_RESP_BODY=$(mktemp)
          SEARCH_HTTP_CODE=$(curl -sS -o "$SEARCH_RESP_BODY" -w "%{http_code}" "${JIRA_CURL_OPTS[@]}" \
            -G \
            -H "$AUTH_HEADER" \
            --data-urlencode "jql=${SEARCH_JQL}" \
            --data-urlencode "maxResults=1" \
            "$JIRA_BASE_URL/rest/api/3/search/jql")

          if [ "$SEARCH_HTTP_CODE" != "200" ]; then
            SEARCH_ERROR_SNIPPET=$(capture_error_snippet "$SEARCH_RESP_BODY")
            echo "Jira search failed with HTTP $SEARCH_HTTP_CODE"
            cat "$SEARCH_RESP_BODY"
            echo "jira_http_code=$SEARCH_HTTP_CODE" >> "$GITHUB_OUTPUT"
            echo "jira_error_snippet=$SEARCH_ERROR_SNIPPET" >> "$GITHUB_OUTPUT"
            echo "failure_class=dedupe_query" >> "$GITHUB_OUTPUT"
            if is_soft_fail_class "dedupe_query"; then
              echo "action=soft_failed_dedupe_query" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi

          EXISTING_KEY=$(jq -r '.issues[0].key // empty' "$SEARCH_RESP_BODY")
          EXISTING_ID=$(jq -r '.issues[0].id // empty' "$SEARCH_RESP_BODY")

          if [ -n "$EXISTING_KEY" ]; then
            echo "issue_key=$EXISTING_KEY" >> "$GITHUB_OUTPUT"
            echo "issue_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
            echo "action=deduped" >> "$GITHUB_OUTPUT"
            echo "Jira issue already exists for latest tag $LATEST_TAG: $EXISTING_KEY"
            exit 0
          fi

          LABEL_SLUG=$(echo "$REPO_FULL" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | sed 's/-*$//')

          ADF_DESC=$(jq -n \
            --arg repo_display "$REPO_DISPLAY" \
            --arg latest "$LATEST_TAG" \
            --arg signal_source "$SIGNAL_SOURCE" \
            --arg run_url "$RUN_URL" \
            'def para($t): {type:"paragraph", content:[{type:"text", text:$t}]};
             def linkPara($label; $url):
               { type:"paragraph", content:[
                   {type:"text", text:$label},
                   {type:"text", text:$url, marks:[{type:"link", attrs:{href:$url}}]}
                 ]};

             {
               type:"doc", version:1,
               content:[
                 para("A new release was detected for " + $repo_display + "."),
                 para("Latest upstream tag: " + $latest),
                 para("Signal source: " + $signal_source),
                 para("Repository: " + $repo_display),
                 linkPara("Workflow run URL: "; $run_url),
                 para("This ticket was created automatically by GitHub Actions for documentation triage.")
               ]
             }')

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY" \
            --argjson adf "$ADF_DESC" \
            --arg label_slug "$LABEL_SLUG" \
            --arg dedupe_label "$DEDUPE_LABEL" \
            --arg summary_issue_id "$SUMMARY_ISSUE_ID" \
            --arg subtask_issue_type_name "$SUBTASK_ISSUE_TYPE_NAME" \
            '{
              fields: {
                project: { key: $proj },
                summary: $summary,
                description: $adf,
                issuetype: { name: $subtask_issue_type_name },
                parent: { id: $summary_issue_id },
                labels: ["documentation","akeyless-public-repos",$label_slug,"scheduled",$dedupe_label]
              }
            }')

          CREATE_RESP_BODY=$(mktemp)
          CREATE_HTTP_CODE=$(curl -sS -o "$CREATE_RESP_BODY" -w "%{http_code}" "${JIRA_CURL_OPTS[@]}" -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          if [ "$CREATE_HTTP_CODE" != "201" ]; then
            CREATE_ERROR_SNIPPET=$(capture_error_snippet "$CREATE_RESP_BODY")
            echo "Failed to create Jira issue. HTTP $CREATE_HTTP_CODE"
            cat "$CREATE_RESP_BODY"
            echo "jira_http_code=$CREATE_HTTP_CODE" >> "$GITHUB_OUTPUT"
            echo "jira_error_snippet=$CREATE_ERROR_SNIPPET" >> "$GITHUB_OUTPUT"
            echo "failure_class=jira_create" >> "$GITHUB_OUTPUT"
            if is_soft_fail_class "jira_create"; then
              echo "action=soft_failed_jira_create" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi

          ISSUE_KEY=$(jq -r '.key // empty' "$CREATE_RESP_BODY")
          ISSUE_ID=$(jq -r '.id // empty' "$CREATE_RESP_BODY")

          if [ -z "$ISSUE_KEY" ]; then
            echo "Failed to create Jira issue. Response:"
            cat "$CREATE_RESP_BODY"
            exit 1
          fi

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "action=created" >> "$GITHUB_OUTPUT"
          echo "Created Jira issue: $ISSUE_KEY"

      - name: Write per-repo result
        if: always()
        id: per_repo
        env:
          REPO_FULL: ${{ matrix.repo_full }}
          IN_SCOPE: ${{ steps.scope.outputs.in_scope }}
          DETECT_HAS_SIGNAL: ${{ steps.detect.outputs.has_signal || 'false' }}
          DETECT_LATEST_TAG: ${{ steps.detect.outputs.latest_tag || '' }}
          DETECT_SIGNAL_SOURCE: ${{ steps.detect.outputs.signal_source || '' }}
          DETECT_FAILURE_CLASS: ${{ steps.detect.outputs.failure_class || '' }}
          DETECT_CONCLUSION: ${{ steps.detect.conclusion }}
          JIRA_ACTION: ${{ steps.jira.outputs.action || '' }}
          JIRA_FAILURE_CLASS: ${{ steps.jira.outputs.failure_class || '' }}
          JIRA_HTTP_CODE: ${{ steps.jira.outputs.jira_http_code || '' }}
          JIRA_ERROR_SNIPPET: ${{ steps.jira.outputs.jira_error_snippet || '' }}
          JIRA_ISSUE_KEY: ${{ steps.jira.outputs.issue_key || '' }}
          JIRA_DEDUPE_LABEL: ${{ steps.jira.outputs.dedupe_label || '' }}
        run: |
          set -euo pipefail
          mkdir -p .github/workflow-results

          SAFE_REPO_SLUG="$REPO_FULL"
          SAFE_REPO_SLUG="${SAFE_REPO_SLUG//\//__}"
          echo "safe_repo_slug=$SAFE_REPO_SLUG" >> "$GITHUB_OUTPUT"

          ACTION="$JIRA_ACTION"
          if [ -z "$ACTION" ]; then
            if [ "$IN_SCOPE" != "true" ]; then
              ACTION="out_of_scope"
            elif [ "$DETECT_HAS_SIGNAL" != "true" ]; then
              ACTION="skipped_no_signal"
            elif [ "$DETECT_CONCLUSION" = "failure" ]; then
              ACTION="failed_detect"
            else
              ACTION="unknown"
            fi
          fi

          RESULT_FILE=".github/workflow-results/${SAFE_REPO_SLUG}.json"
          jq -n \
            --arg repo "$REPO_FULL" \
            --arg in_scope "$IN_SCOPE" \
            --arg action "$ACTION" \
            --arg latest_tag "$DETECT_LATEST_TAG" \
            --arg signal_source "$DETECT_SIGNAL_SOURCE" \
            --arg detect_failure_class "$DETECT_FAILURE_CLASS" \
            --arg jira_failure_class "$JIRA_FAILURE_CLASS" \
            --arg jira_http_code "$JIRA_HTTP_CODE" \
            --arg jira_error_snippet "$JIRA_ERROR_SNIPPET" \
            --arg issue_key "$JIRA_ISSUE_KEY" \
            --arg dedupe_label "$JIRA_DEDUPE_LABEL" \
            '{
              repo: $repo,
              in_scope: ($in_scope == "true"),
              action: $action,
              latest_tag: $latest_tag,
              signal_source: $signal_source,
              detect_failure_class: $detect_failure_class,
              jira_failure_class: $jira_failure_class,
              jira_http_code: $jira_http_code,
              jira_error_snippet: $jira_error_snippet,
              issue_key: $issue_key,
              dedupe_label: $dedupe_label
            }' > "$RESULT_FILE"

      - name: Upload per-repo result artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repo-scan-${{ steps.per_repo.outputs.safe_repo_slug }}
          path: .github/workflow-results/*.json
          if-no-files-found: error

  summarize-run:
    if: always()
    needs:
      - check-repo
    runs-on: ubuntu-latest
    steps:
      - name: Download per-repo artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: repo-scan-*
          path: .github/workflow-results
          merge-multiple: true

      - name: Build run summary
        run: |
          set -euo pipefail
          mkdir -p .github/workflow-results

          python3 - <<'PY'
          import glob
          import json
          from collections import Counter
          from pathlib import Path

          files = sorted(glob.glob('.github/workflow-results/*.json'))
          results = []
          for path in files:
            with open(path, encoding='utf-8') as f:
              results.append(json.load(f))

          action_counts = Counter(r.get('action', 'unknown') for r in results)
          detect_failures = Counter(r.get('detect_failure_class') for r in results if r.get('detect_failure_class'))
          jira_failures = Counter(r.get('jira_failure_class') for r in results if r.get('jira_failure_class'))

          summary = {
            'repos_total': len(results),
            'actions': dict(action_counts),
            'detect_failure_classes': dict(detect_failures),
            'jira_failure_classes': dict(jira_failures),
          }

          Path('.github/workflow-results/run-summary.json').write_text(
            json.dumps(summary, indent=2), encoding='utf-8'
          )

          lines = [
            '# Akeyless Public Repos Update Summary',
            '',
            f"- Repos evaluated: {len(results)}",
            '',
            '## Actions',
            '',
          ]
          for k, v in sorted(action_counts.items()):
            lines.append(f"- {k}: {v}")

          if detect_failures:
            lines.extend(['', '## Detect failure classes', ''])
            for k, v in sorted(detect_failures.items()):
              lines.append(f"- {k}: {v}")

          if jira_failures:
            lines.extend(['', '## Jira failure classes', ''])
            for k, v in sorted(jira_failures.items()):
              lines.append(f"- {k}: {v}")

          Path('.github/workflow-results/run-summary.md').write_text(
            '\n'.join(lines) + '\n', encoding='utf-8'
          )
          PY

          cat .github/workflow-results/run-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run summary artifact
        uses: actions/upload-artifact@v7
        with:
          name: akeyless-public-repos-run-summary
          path: |
            .github/workflow-results/run-summary.json
            .github/workflow-results/run-summary.md
          if-no-files-found: error

  notify-on-failure:
    name: Notify Jira on Workflow Failure
    if: failure() && github.event_name == 'schedule'
    needs:
      - load-repo-list
      - create-run-summary-task
      - check-repo
      - summarize-run
    runs-on: ubuntu-latest
    steps:
      - name: Create Jira failure notification
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TS="$(date -u +'%Y-%m-%d %H:%M UTC')"
          SUMMARY="Workflow failure: ${WORKFLOW_NAME} (${BRANCH}) – ${TS}"

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"
          JIRA_CURL_OPTS=(
            --retry 3
            --retry-all-errors
            --retry-delay 2
            --retry-max-time 30
            --connect-timeout 10
            --max-time 45
          )

          ADF_DESC=$(jq -n \
            --arg workflow "$WORKFLOW_NAME" \
            --arg branch "$BRANCH" \
            --arg run_id "$RUN_ID" \
            --arg run_url "$RUN_URL" \
            --arg ts "$TS" \
            'def para($t): {type:"paragraph", content:[{type:"text", text:$t}]};
             def linkPara($label; $url):
               {type:"paragraph", content:[
                 {type:"text", text:$label},
                 {type:"text", text:$url, marks:[{type:"link", attrs:{href:$url}}]}
               ]};
             {
               type:"doc", version:1,
               content:[
                 para("A scheduled GitHub Actions workflow failed and requires investigation."),
                 para("Workflow: " + $workflow),
                 para("Branch: " + $branch),
                 para("Run ID: " + $run_id),
                 para("Timestamp: " + $ts),
                 linkPara("Workflow run URL: "; $run_url),
                 para("This ticket was created automatically because the scheduled run failed.")
               ]
             }')

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY" \
            --argjson adf "$ADF_DESC" \
            '{
              fields: {
                project: {key: $proj},
                summary: $summary,
                description: $adf,
                issuetype: {name: "Task"},
                labels: ["automation","workflow-failure","scheduled"]
              }
            }')

          RESP=$(curl -sS "${JIRA_CURL_OPTS[@]}" -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          ISSUE_KEY=$(echo "$RESP" | jq -r '.key // empty')
          if [ -z "$ISSUE_KEY" ]; then
            echo "Failed to create failure notification Jira issue. Response:"
            echo "$RESP"
            exit 1
          fi

          echo "Created failure notification Jira issue: $ISSUE_KEY"
