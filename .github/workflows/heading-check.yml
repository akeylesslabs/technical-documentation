name: Markdown Heading Audit

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays at 2 AM UTC
  workflow_dispatch: # allow manual runs

jobs:
  heading-audit:
    runs-on: ubuntu-latest

    steps:

      # 0. Checkout repo  
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 1. Scan Markdown headings
      - name: Scan Markdown headings
        id: scan_headings
        run: |
          set -euo pipefail

          mkdir -p .github/heading-audit
          REPORT=".github/heading-audit/heading-report.md"

          echo "# Markdown Heading Audit" > "$REPORT"
          echo "" >> "$REPORT"
          echo "_Run: $(date -u +"%Y-%m-%d %H:%M:%S UTC")_" >> "$REPORT"
          echo "" >> "$REPORT"

          FOUND_ISSUES=0

          echo "## Files using Heading 1 (#)" >> "$REPORT"
          echo "" >> "$REPORT"

          # 1. Detect any usage of Heading 1 in Markdown.
          #    Match lines starting with a single `#` and a space, but not `##`.
          while IFS= read -r -d '' FILE; do
            if grep -qE '^[[:space:]]*# [^#]' "$FILE"; then
              FOUND_ISSUES=$((FOUND_ISSUES+1))
              echo "- $FILE" >> "$REPORT"
            fi
          done < <(find . -type f -name "*.md" -print0)

          echo "" >> "$REPORT"
          echo "## Files that use headings but have no Heading 2 (##)" >> "$REPORT"
          echo "" >> "$REPORT"

          # 2. Detect pages that don't use Heading 2 but use other headings.
          while IFS= read -r -d '' FILE; do
            # Does the file have ANY markdown headings (#..######)?
            if grep -qE '^[[:space:]]*#{1,6}[[:space:]]+' "$FILE"; then
              # Does the file have a Heading 2?
              if ! grep -qE '^[[:space:]]*##[[:space:]]+' "$FILE"; then
                FOUND_ISSUES=$((FOUND_ISSUES+1))
                echo "- $FILE" >> "$REPORT"
              fi
            fi
          done < <(find . -type f -name "*.md" -print0)

          echo "" >> "$REPORT"

          if [ "$FOUND_ISSUES" -gt 0 ]; then
            SUMMARY="$FOUND_ISSUES heading rule violation(s) found"
            echo "$SUMMARY" >> "$REPORT"
            # This sets: steps.scan_headings.outputs.found_issues
            echo "found_issues=true" >> "$GITHUB_OUTPUT"
          else
            SUMMARY="No heading rule violations found"
            echo "$SUMMARY" >> "$REPORT"
            echo "found_issues=false" >> "$GITHUB_OUTPUT"
          fi

          echo "HEADING_SUMMARY=$SUMMARY" >> "$GITHUB_ENV"

      # 2. If issues found, commit the report
      - name: Commit heading report to branch
        if: steps.scan_headings.outputs.found_issues == 'true'
        id: commit_branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="automation/markdown-heading-audit"
          # Create/Update branch from current HEAD (usually default branch)
          git fetch origin
          git checkout -B "$BRANCH"

          git add .github/heading-audit/heading-report.md

          if git diff --cached --quiet; then
            echo "No changes to commit (report unchanged)."
          else
            git commit -m "chore: add markdown heading audit report [skip ci]"
            git push origin "$BRANCH" --force
          fi

          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"

      # 3. If issues found, get the commit URL
      - name: Get commit URL
        if: steps.scan_headings.outputs.found_issues == 'true'
        id: commiturl
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      # 4. If issues found, create a Jira issue (ADF description)
      - name: Create Jira issue
        if: steps.scan_headings.outputs.found_issues == 'true'
        id: jira
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
          HEADING_SUMMARY: ${{ env.HEADING_SUMMARY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: automation/markdown-heading-audit
          COMMIT_URL: ${{ steps.commiturl.outputs.url }}
        run: |
          set -e

          TS="$(date -u +'%Y-%m-%d %H:%M UTC')"
          SUMMARY="Heading audit ${TS} – $GITHUB_REPOSITORY@$BRANCH_NAME"

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"

          # Build ADF (Atlassian Document Format) description via jq
          ADF_DESC=$(jq -n \
            --arg summ "$HEADING_SUMMARY" \
            --arg run  "$RUN_URL" \
            --arg br   "$BRANCH_NAME" \
            --arg commit "$COMMIT_URL" \
            '{
              type: "doc", version: 1,
              content: [
                { "type":"paragraph", "content":[{ "type":"text", "text":"Automated markdown heading audit" }] },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"Summary: " },
                    { "type":"text", "text":$summ }
                  ]
                },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"Workflow run: " },
                    { "type":"text", "text":$run, "marks":[{"type":"link","attrs":{"href":$run}}] }
                  ]
                },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"Branch: " },
                    { "type":"text", "text":$br }
                  ]
                },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"Commit: " },
                    { "type":"text", "text":$commit, "marks":[{"type":"link","attrs":{"href":$commit}}] }
                  ]
                },
                { "type":"paragraph", "content":[{ "type":"text", "text":"Files written:" }] },
                { "type":"bulletList", "content":[
                    { "type":"listItem", "content":[
                        { "type":"paragraph", "content":[
                            { "type":"text","text":".github/heading-audit/heading-report.md" }
                          ]}
                      ]}
                  ]
                },
                { "type":"paragraph", "content":[
                    { "type":"text", "text":"This ticket was created automatically by GitHub Actions." }
                  ]
                }
              ]
            }')

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY" \
            --argjson adf "$ADF_DESC" \
            '{
              fields: {
                project: { key: $proj },
                summary: $summary,
                description: $adf,
                issuetype: { name: "Task" },
                labels: ["heading-audit","automation","documentation"]
              }
            }')

          RESP=$(curl -sS -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          ISSUE_KEY=$(echo "$RESP" | jq -r '.key // empty')
          ISSUE_ID=$(echo "$RESP" | jq -r '.id // empty')

          if [ -z "$ISSUE_KEY" ]; then
            echo "Failed to create Jira issue. Response:"
            echo "$RESP"
            exit 1
          fi

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "Created Jira issue: $ISSUE_KEY"

      # 5. If Jira issue created, attach artifacts to Jira issue
      - name: Attach artifacts to Jira issue
        if: always() && steps.jira.outputs.issue_key != ''
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
        run: |
          set -e

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"
          ISSUE_KEY="${{ steps.jira.outputs.issue_key }}"

          attach_file () {
            local fpath="$1"
            if [ -f "$fpath" ]; then
              echo "Attaching $fpath to $ISSUE_KEY"
              curl -sS -X POST \
                -H "$AUTH_HEADER" \
                -H "X-Atlassian-Token: no-check" \
                -F "file=@${fpath}" \
                "$JIRA_BASE_URL/rest/api/3/issue/${ISSUE_KEY}/attachments" >/dev/null
            else
              echo "File not found: $fpath (skipping)"
            fi
          }

          attach_file ".github/heading-audit/heading-report.md"