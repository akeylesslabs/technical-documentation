# Weekly automation is consolidated in .github/workflows/automated-workflow-fixes.yml.
# This workflow is kept for manual runs only.
name: Markdown Linter (Manual)
permissions:
  contents: write

on:
  workflow_dispatch: # allow manual runs

jobs:
  markdownlint-fix:
    runs-on: ubuntu-latest

    steps:
      # 0. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 1. Install markdownlint-cli2 globally
      - name: Install markdownlint-cli2
        run: |
          npm install -g markdownlint-cli2


      # 2. Prepare outputs dir
      - name: Prepare output directories
        run: |
          mkdir -p .github/markdownlint

      # 3. Run markdownlint with --fix (capture output; don't fail the job)
      - name: Run markdownlint (fix)
        id: mdl
        continue-on-error: true
        run: |
          set +e
          npx markdownlint-cli2 --fix --config .github/markdownlint/.markdownlint-cli2.yaml 'docs/**/*.md' \
            > .github/markdownlint/markdownlint-fix-out.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      # 4. Detect whether anything changed and whether lint violations remain
      - name: Detect changes and violations
        id: changes
        run: |
          set -e

          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ steps.mdl.outputs.exit_code }}" != "0" ]; then
            echo "has_violations=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_violations=false" >> "$GITHUB_OUTPUT"
          fi

      # 5. Commit fixes + output report to automation branch
      - name: Commit fixes to branch
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="automated-md-linting"
          git fetch origin
          git checkout -B "$BRANCH"

          # Stage docs fixes + report artifact
          git add docs/**/*.md .github/markdownlint/markdownlint-fix-out.txt || true

          git commit -m "chore: auto-fix markdownlint issues [skip ci]" || echo "No changes to commit"
          git push origin "$BRANCH" --force

      # 6. Get commit URL (only meaningful if changes were committed)
      - name: Get commit URL
        id: commiturl
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${GITHUB_REPOSITORY}/commit/${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      # 7. Create Jira issue when fixes were committed OR violations remain
      - name: Create Jira issue
        id: jira
        if: steps.changes.outputs.has_changes == 'true' || steps.changes.outputs.has_violations == 'true'
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.DOCS_JIRA_PROJECT_KEY }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH_NAME: automated-md-linting
          COMMIT_URL: ${{ steps.commiturl.outputs.url }}
        run: |
          set -e

          TS="$(date -u +'%Y-%m-%d %H:%M UTC')"
          SUMMARY="Markdown lint auto-fix ${TS} – $GITHUB_REPOSITORY@$BRANCH_NAME"

          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"
          JIRA_CURL_OPTS=(
            --retry 3
            --retry-all-errors
            --retry-delay 2
            --retry-max-time 30
            --connect-timeout 10
            --max-time 45
          )

          # Optional: include a short list of changed files (bounded)
          CHANGED_FILES=$(git show --name-only --pretty="" HEAD | sed '/^\s*$/d' | head -50)
          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES="(no file list available)"
          fi

          ADF_DESC=$(jq -n \
            --arg run     "$RUN_URL" \
            --arg br      "$BRANCH_NAME" \
            --arg commit  "$COMMIT_URL" \
            --arg files   "$CHANGED_FILES" \
            'def para($t): {type:"paragraph", content:[{type:"text", text:$t}]};
             def linkPara($label; $url):
               { type:"paragraph", content:[
                   {type:"text", text:$label},
                   {type:"text", text:$url, marks:[{type:"link", attrs:{href:$url}}]}
                 ]};
             def codeBlock($t):
               {type:"codeBlock", attrs:{language:""}, content:[{type:"text", text:$t}]};

             {
               type:"doc", version:1,
               content: [
                 para("Automated markdownlint-cli2 run with --fix for docs/**/*.md."),
                 linkPara("Workflow run: "; $run),
                 para("Branch: " + $br),
                 linkPara("Commit: "; $commit),
                 para("Changed files (first 50):"),
                 codeBlock($files),
                 para("Attached: markdownlint output report."),
                 para("This ticket was created automatically by GitHub Actions.")
               ]
             }')

          PAYLOAD=$(jq -n \
            --arg proj "$JIRA_PROJECT_KEY" \
            --arg summary "$SUMMARY" \
            --argjson adf "$ADF_DESC" \
            '{
              fields: {
                project: { key: $proj },
                summary: $summary,
                description: $adf,
                issuetype: { name: "Task" },
                labels: ["markdownlint","automation","documentation"]
              }
            }')

          RESP=$(curl -sS "${JIRA_CURL_OPTS[@]}" -X POST \
            -H "$AUTH_HEADER" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/3/issue")

          ISSUE_KEY=$(echo "$RESP" | jq -r '.key // empty')
          ISSUE_ID=$(echo "$RESP" | jq -r '.id // empty')

          if [ -z "$ISSUE_KEY" ]; then
            echo "Failed to create Jira issue. Response:"
            echo "$RESP"
            exit 1
          fi

          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "issue_id=$ISSUE_ID" >> "$GITHUB_OUTPUT"
          echo "Created Jira issue: $ISSUE_KEY"

      # 8. Attach markdownlint output to Jira issue
      - name: Attach artifacts to Jira issue
        if: steps.jira.outputs.issue_key != ''
        continue-on-error: true
        env:
          JIRA_BASE_URL: ${{ secrets.DOCS_JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.DOCS_JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.DOCS_JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          set -e
          AUTH_HEADER="Authorization: Basic $(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)"
          JIRA_CURL_OPTS=(
            --retry 3
            --retry-all-errors
            --retry-delay 2
            --retry-max-time 30
            --connect-timeout 10
            --max-time 45
          )

          attach_file () {
            local fpath="$1"
            if [ -f "$fpath" ]; then
              echo "Attaching $fpath to $ISSUE_KEY"
              curl -sS "${JIRA_CURL_OPTS[@]}" -X POST \
                -H "$AUTH_HEADER" \
                -H "X-Atlassian-Token: no-check" \
                -F "file=@${fpath}" \
                "$JIRA_BASE_URL/rest/api/3/issue/${ISSUE_KEY}/attachments" >/dev/null
            else
              echo "File not found: $fpath (skipping)"
            fi
          }

          attach_file ".github/markdownlint/markdownlint-fix-out.txt"
