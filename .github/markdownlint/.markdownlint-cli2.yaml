# npx markdownlint-cli2 --fix --config .github/markdownlint/.markdownlint-cli2.yaml 'docs/**/*.md'
# npx markdownlint-cli2 --config .github/markdownlint/.markdownlint-cli2.yaml 'docs/**/*.md'

# Load Akeyless custom rules
customRules:
  - ./custom-rules.js

config:
  # =========================
  # Akeyless Custom Rules
  # =========================

  # AKY001: Disallow Heading 1 (H1); reserved for ReadMe titles
  # Knobs:
  #   - severity: error|warning|info
  AKY001: true

  # AKY002: Require headings to start at H2 and not skip levels
  # Knobs:
  #   - severity: error|warning|info
  AKY002: true

  # AKY003: Disallow bold-only pseudo-headings
  # Knobs:
  #   - severity: error|warning|info
  AKY003: true

  # AKY004: Require language identifiers on fenced code blocks
  # Knobs:
  #   - severity: error|warning|info
  AKY004: true

  # AKY005: Disallow generic link text (e.g., "click here")
  # Knobs:
  #   - severity: error|warning|info
  AKY005: false

  # AKY006: Disallow Latin abbreviations (e.g., i.e., ad hoc)
  # Knobs:
  #   - severity: error|warning|info
  AKY006: true

  # AKY007: Prefer third-person voice (heuristic)
  # Knobs:
  #   - severity: error|warning|info
  AKY007: false

  # AKY008: Enforce Oxford comma (heuristic)
  # Knobs:
  #   - severity: error|warning|info
  AKY008: false

  # AKY009: Disallow ampersands ("&") in prose
  #
  # Purpose:
  #   Flags ampersands in narrative text to enforce consistent, localized, and accessible writing.
  #   Replace "&" with "and" in sentences.
  #
  # Why:
  #   Ampersands reduce readability and can create inconsistency across languages and UI surfaces.
  #
  # Defaults / Recommended configuration:
  #   The recommended configuration reduces false positives by ignoring:
  #     - Headings (often contain product names or short labels)
  #     - Code blocks and inline code spans (examples, commands, configuration)
  #     - Bolded text (often UI labels or button names that contain "&")
  #
  # Options:
  #   allow_headings (boolean, default: true)
  #     - true  => ignore '&' in headings
  #     - false => flag '&' in headings
  #
  #   allow_code (boolean, default: true)
  #     - true  => ignore '&' inside fenced/indented code blocks and inline code spans
  #     - false => flag '&' inside code blocks/spans
  #
  #   allow_bold (boolean, default: true)
  #     - true  => ignore '&' inside **bold** and __bold__
  #     - false => flag '&' inside bold text
  #
  # Notes:
  #   - This rule always scans for all ampersands unless a context is explicitly suppressed by options above.
  #   - If you need strict enforcement (flag everywhere), set all options to false.
  #
  # Knobs:
  #   - severity: error|warning|info
  AKY009:
    ignore_headings: true
    ignore_code: true
    ignore_bold: true
    ignore_urls: true

  # AKY010: Enforce ISO 8601 dates (YYYY-MM-DD)
  # Knobs:
  #   - severity: error|warning|info
  AKY010: true

  # AKY011: Skipped

  # AKY012: Enforce SI unit formatting (space + casing)
  # Knobs:
  #   - severity: error|warning|info
  AKY012: true

  # AKY013: Proper names capitalization (MD044-like), ignoring inline HTML <a>...</a> and URLs
  # Knobs:
  #   - severity: error|warning|info
  #   - code_blocks: true|false
  #   - ignore_a_html_tag: true|false
  #   - names_file: .cspell/akeyless-proper-nouns-dictionary.txt
  #   - ignore_urls: true
  AKY013: true

  # AKY014: Require meaningful image alt text
  # Knobs:
  #   - severity: error|warning|info
  AKY014: false

  # AKY015: Disallow links inside code blocks AND code spans inside links
  # Knobs:
  #   - severity: error|warning|info
  AKY015: true

  # AKY016: Disallow HTTP Link Parameters
  # Knobs:
  #   - severity: error|warning|info
  #   - tracking_parameters:
  #       - utm_source
  #       - utm_medium
  #   - allow_parameters:
  #       - ref
  AKY016: true

  # AKY017: Disallow banned terminology and suggest preferred replacements
  # Purpose:
  #   Enforces approved product and security terminology across documentation.
  #   Flags banned terms case-insensitively and provides guidance on preferred phrasing.
  #
  # Behavior:
  #   - Searches case-insensitively
  #   - Scans normal text, Markdown link text, link destinations (URLs), and inline/block HTML
  #   - Ignores fenced/indented code blocks and inline code spans
  #
  # Knobs:
  #   - severity: error|warning|info
  #   - terms:
  #       - term: string               # Banned term or phrase
  #         replacement: string        # Preferred replacement text
  #         example_from: string        # (Optional) Example of discouraged usage
  #         example_to: string          # (Optional) Example of preferred usage
  AKY017:
    terms:
      # Akeyless Marketing Requests/Changes
      - term: "Vaultless"
        replacement: "Zero-Knowledge Encryption with Patented DFC"
        example_from: "Vaultless Security with DFC"
        example_to: "Zero-Knowledge Encryption with Patented DFC"

      - term: "vault-less"
        replacement: "Zero-Knowledge Encryption with Patented DFC"
        example_from: "Vaultless Security with DFC"
        example_to: "Zero-Knowledge Encryption with Patented DFC"

      - term: "Non-human"
        replacement: "Workload Identity Federation"
        example_from: "Non-Human Identity Federation"
        example_to: "Workload Identity Federation"

      - term: "in the CLI"
        replacement: "with the CLI"
        example_from: "in the CLI"
        example_to: "with the CLI"

      - term: "from the CLI"
        replacement: "with the CLI"
        example_from: "from the CLI"
        example_to: "with the CLI"

      # Acronyms to not use
      - term: "PM"
        replacement: "Akeyless Password Manager"
        example_from: "The Akeyless PM mobile app..."
        example_to: "The Akeyless Password Manager mobile app..."

      - term: "HVP"
        replacement: "HashiCorp Vault Proxy"
        example_from: "HVP"
        example_to: "HashiCorp Vault Proxy"

      - term: "RestAPI"
        replacement: "REST API"
        example_from: "RestAPI"
        example_to: "REST API"
        
      # Ableist / exclusionary phrasing
      - term: "sanity check"
        replacement: "quick check"
        example_from: "Run a sanity check on the configuration."
        example_to: "Run a quick check on the configuration."

      - term: "dummy value"
        replacement: "placeholder value"
        example_from: "Use a dummy value for testing."
        example_to: "Use a placeholder value for testing."

      - term: "dummy data"
        replacement: "sample data"
        example_from: "Load dummy data into the database."
        example_to: "Load sample data into the database."

      - term: "cripple"
        replacement: "disable"
        example_from: "Cripple TLS verification in dev."
        example_to: "Disable TLS verification in dev."

      - term: "crippled"
        replacement: "disabled"
        example_from: "The feature is crippled by default."
        example_to: "The feature is disabled by default."

      - term: "crazy"
        replacement: "unexpected"
        example_from: "If you see a crazy error, retry."
        example_to: "If you see an unexpected error, retry."

      - term: "insane"
        replacement: "unexpected"
        example_from: "An insane number of requests can occur."
        example_to: "An unexpected number of requests can occur."

      - term: "lame"
        replacement: "suboptimal"
        example_from: "This is a lame workaround."
        example_to: "This is a suboptimal workaround."

      # Commonly discouraged technical metaphors
      - term: "blacklist"
        replacement: "denylist"
        example_from: "Add the IP to the blacklist."
        example_to: "Add the IP to the denylist."

      - term: "black-list"
        replacement: "denylist"
        example_from: "Add the IP to the blacklist."
        example_to: "Add the IP to the denylist."

      - term: "black list"
        replacement: "denylist"
        example_from: "Add the IP to the blacklist."
        example_to: "Add the IP to the denylist."

      - term: "whitelist"
        replacement: "allowlist"
        example_from: "Add the user to the whitelist."
        example_to: "Add the user to the allowlist."

      - term: "white-list"
        replacement: "allowlist"
        example_from: "Add the user to the whitelist."
        example_to: "Add the user to the allowlist."

      - term: "white list"
        replacement: "allowlist"
        example_from: "Add the user to the whitelist."
        example_to: "Add the user to the allowlist."

      #- term: "master"
      #  replacement: "primary"
      #  example_from: "Promote the master node."
      #  example_to: "Promote the primary node."

      - term: "slave"
        replacement: "replica"
        example_from: "The slave database is lagging."
        example_to: "The replica database is lagging."

      # UI language that improves accessibility clarity
      - term: "see above"
        replacement: "refer to the previous section"
        example_from: "See above for details."
        example_to: "Refer to the previous section for details."

      - term: "see below"
        replacement: "refer to the next section"
        example_from: "See below for more information."
        example_to: "Refer to the next section for more information."

      #- term: "click here"
      #  replacement: "select the link (descriptive text)"
      #  example_from: "Click here to open the console."
      #  example_to: "Open the Akeyless Console."

      - term: "just click"
        replacement: "select"
        example_from: "Just click the button to continue."
        example_to: "Select the button to continue."

      - term: "Akelyess"
        replacement: "Akeyless"
        example_from: "Akelyess is misspelled."
        example_to: "Akeyless is correct."

      - term: "Akeless"
        replacement: "Akeyless"
        example_from: "Akeless is misspelled."
        example_to: "Akeyless is correct."

      # Idioms
      - term: "bird's eye"
        replacement: "high-level"
        example_from: "This interface provides a bird's eye view of your items."
        example_to: "This interface provides a high-level view of your items."

  # =========================
  # Core markdownlint Rules
  # =========================

  # MD001: Heading levels should only increment by one level
  # Knobs:
  #   - severity: error|warning|info
  MD001: true

  # MD002: First heading should be top-level
  # Knobs:
  #   - severity: error|warning|info
  MD002: true

  # MD003: Heading style (ATX vs Setext)
  # Knobs:
  #   - severity: error|warning|info
  #   - style: consistent|atx|setext
  #   - style options:
  #       - consistent
  #       - atx
  #       - setext
  MD003:
    style: atx

  # MD004: Unordered list style
  # Knobs:
  #   - severity: error|warning|info
  #   - style: consistent|dash|asterisk|plus
  #   - style options:
  #       - consistent
  #       - dash
  #       - asterisk
  #       - plus
  MD004:
    style: asterisk

  # MD005: Inconsistent list indentation
  # Knobs:
  #   - severity: error|warning|info
  MD005: true

  # MD006: Lists should start at beginning of line
  # Knobs:
  #   - severity: error|warning|info
  MD006: true

  # MD007: Unordered list indentation
  # Knobs:
  #   - severity: error|warning|info
  #   - indent: integer (common values: 2|4)
  #   - start_indented: true|false
  #   - indent examples:
  #       - 2
  #       - 4
  #   - start_indented options:
  #       - true
  #       - false
  MD007:
    start_indented: false
    indent: 4

  # MD008: Unordered nested list indentation
  # Ensures consistent indentation for items in unordered lists.
  # Helps keep nested lists readable and avoids Markdown rendering differences
  # across tools and platforms.
  #
  # Knobs:
  #   - severity: error|warning|info
  #   - indent: integer (common values: 2|4)
  #   - start_indented: true|false
  #
  # indent examples:
  #   - 2
  #   - 4
  #
  # start_indented options:
  #   - true
  #   - false
  MD008:
    start_indented: false
    indent: 4
    

  # MD009: Trailing spaces
  # Knobs:
  #   - severity: error|warning|info
  #   - br_spaces: integer (common: 0|2)
  #   - list_item_empty_lines: true|false
  #   - strict: true|false
  #   - br_spaces examples:
  #       - 0
  #       - 2
  #   - list_item_empty_lines options:
  #       - true
  #       - false
  #   - strict options:
  #       - true
  #       - false
  MD009: true

  # MD010: Hard tabs
  # Knobs:
  #   - severity: error|warning|info
  #   - code_blocks: true|false
  #   - code_blocks options:
  #       - true
  #       - false
  MD010:
    code_blocks: true

  # MD011: Reversed link syntax
  # Knobs:
  #   - severity: error|warning|info
  MD011: true

  # MD012: Multiple consecutive blank lines
  # Knobs:
  #   - severity: error|warning|info
  #   - maximum: integer (common: 1|2)
  #   - maximum examples:
  #       - 1
  #       - 2
  MD012: true

  # MD013: Line length
  # Knobs:
  #   - severity: error|warning|info
  #   - line_length: integer
  #   - heading_line_length: integer
  #   - code_block_line_length: integer
  #   - code_blocks: true|false
  #   - tables: true|false
  #   - headings: true|false
  #   - strict: true|false
  #   - stern: true|false
  #   - common integer examples:
  #       - 80
  #       - 100
  #       - 120
  #   - boolean options:
  #       - true
  #       - false
  MD013:
    line_length: 1000
    headings: true
    heading_line_length: 120
    code_blocks: false
    code_block_line_length: 9999
    tables: false
    strict: false
    stern: true

  # MD014: Disallow dollar signs ($) before shell commands
  # Knobs:
  #   - severity: error|warning|info
  MD014: true

  # MD018: No space after hash in ATX headings
  # Knobs:
  #   - severity: error|warning|info
  MD018: true

  # MD019: Multiple spaces after hash
  # Knobs:
  #   - severity: error|warning|info
  MD019: true

  # MD020: No space inside closed ATX headings
  # Knobs:
  #   - severity: error|warning|info
  MD020: true

  # MD021: Multiple spaces inside closed ATX headings
  # Knobs:
  #   - severity: error|warning|info
  MD021: true

  # MD022: Headings surrounded by blank lines
  # Knobs:
  #   - severity: error|warning|info
  MD022: true

  # MD023: Headings must start at beginning of line
  # Knobs:
  #   - severity: error|warning|info
  MD023: true

  # MD024: Duplicate heading content
  # 
  # Note: This isn't ready yet, specifically because of the CLI Reference
  # 
  # Knobs:
  #   - severity: error|warning|info
  #   - allow_different_nesting: true|false
  #   - siblings_only: true|false
  #   - allow_different_nesting options:
  #       - true
  #       - false
  #   - siblings_only options:
  #       - true
  #       - false
  MD024: false

  # MD025: Multiple top-level headings
  # Knobs:
  #   - severity: error|warning|info
  #   - level: integer (commonly 1)
  #   - front_matter_title: string (pattern; empty disables)
  #   - level examples:
  #       - 1
  #       - 2
  #   - front_matter_title examples:
  #       - ""
  #       - "title"
  #       - "^\s*title\s*[:=]"
  MD025: true

  # MD026: Trailing punctuation in headings
  # Knobs:
  #   - severity: error|warning|info
  #   - punctuation: string (characters to disallow)
  #   - punctuation examples:
  #       - ".,;:!?"
  #       - ".,;:"
  MD026: true

  # MD027: Multiple spaces after blockquote symbol
  # Knobs:
  #   - severity: error|warning|info
  MD027: true

  # MD028: Blank line inside blockquote
  # Knobs:
  #   - severity: error|warning|info
  MD028: true

  # MD029: Ordered list marker style
  # Knobs:
  #   - severity: error|warning|info
  #   - style: one_or_ordered|one|ordered
  #   - style options:
  #       - one_or_ordered
  #       - one
  #       - ordered
  MD029:
    style: one_or_ordered

  # MD030: Spaces after list markers
  # Knobs:
  #   - severity: error|warning|info
  #   - ul_single: integer
  #   - ol_single: integer
  #   - ul_multi: integer
  #   - ol_multi: integer
  #   - common integer examples:
  #       - 1
  #       - 2
  MD030:
      ul_single: 1
      ol_single: 1
      ul_multi: 1
      ol_multi: 1

  # MD031: Fenced code blocks surrounded by blank lines
  # DO NOT USE. This is incompatible with how ReadMe.com handles code block tabbing.
  # Knobs:
  #   - severity: error|warning|info
  MD031: false

  # MD032: Lists surrounded by blank lines
  # Knobs:
  #   - severity: error|warning|info
  MD032: true

  # MD033: Inline HTML
  # Knobs:
  #   - severity: error|warning|info
  #   - allowed_elements: [string]
  #   - allowed_elements examples:
  #       - []
  #       - ["details", "summary"]
  #       - ["br", "kbd", "sup", "sub"]
  MD033:
    allowed_elements:
      - "details"
      - "summary"
      - "a"
      - "p"
      - "svg"
      - "path"
      # Table Elements
      - "table"
      - "thead"
      - "th"
      - "tbody"
      - "tr"
      - "td"
      # ReadMe Proprietary
      - "HTMLBlock"
      - "Image"
      - "Callout"
      - "Anchor"
      - "Embed"
      - "Recipe"
      - "Tabs"
      - "Tab"
      - "Cards"
      - "Card"
      - "Columns"
      - "Column"
      - "Accordion"
      # ReadMe Reusable Elements
      - "CLIGeneralFlags"
      - "ApiKeyWarning"

  # MD034: Bare URLs
  # Knobs:
  #   - severity: error|warning|info
  MD034: true

  # MD035: Horizontal rule style
  # Knobs:
  #   - severity: error|warning|info
  #   - style: consistent|---|***|___
  #   - style options:
  #       - consistent
  #       - ---
  #       - ***
  #       - ___
  MD035:
    style: "***"

  # MD036: Emphasis used instead of heading
  # Knobs:
  #   - severity: error|warning|info
  MD036: true

  # MD037: Spaces inside emphasis markers
  # Knobs:
  #   - severity: error|warning|info
  MD037: true

  # MD038: Spaces inside code spans
  # Knobs:
  #   - severity: error|warning|info
  MD038: true

  # MD039: Spaces inside link text
  # Knobs:
  #   - severity: error|warning|info
  MD039: true

  # MD040: Code fences must specify language
  # Knobs:
  #   - severity: error|warning|info
  MD040: true

  # MD041: First line should be top-level heading
  # Knobs:
  #   - severity: error|warning|info
  #   - level: integer (commonly 1)
  #   - level examples:
  #       - 1
  #       - 2
  MD041: true

  # MD042: No empty links
  # Knobs:
  #   - severity: error|warning|info
  MD042: true

  # MD043: Required heading structure
  # Knobs:
  #   - severity: error|warning|info
  #   - headings: [string]
  #   - match_case: true|false
  #   - headings examples:
  #       - []
  #       - ["## Prerequisites", "## Installation", "## Usage"]
  #   - match_case options:
  #       - true
  #       - false
  MD043: false

  # MD044: Proper names capitalization
  # Superseded by AKY013
  MD044: false

  # MD045: Images must have alt text
  # Knobs:
  #   - severity: error|warning|info
  MD045: true

  # MD046: Code block style
  # Knobs:
  #   - severity: error|warning|info
  #   - style: consistent|fenced|indented
  #   - style options:
  #       - consistent
  #       - fenced
  #       - indented
  MD046:
    style: fenced

  # MD047: File must end with newline
  # Knobs:
  #   - severity: error|warning|info
  MD047: true

  # MD048: Code fence style
  # Knobs:
  #   - severity: error|warning|info
  #   - style: consistent|backtick|tilde
  #   - style options:
  #       - consistent
  #       - backtick
  #       - tilde
  MD048:
    style: backtick

  # MD049: Emphasis style
  # Knobs:
  #   - severity: error|warning|info
  #   - style: consistent|asterisk|underscore
  #   - style options:
  #       - consistent
  #       - asterisk
  #       - underscore
  MD049:
    style: underscore

  # MD050: Strong emphasis style
  # Knobs:
  #   - severity: error|warning|info
  #   - style: consistent|asterisk|underscore
  #   - style options:
  #       - consistent
  #       - asterisk
  #       - underscore
  MD050:
    style: asterisk

  # MD051: Valid link fragments
  # Knobs:
  #   - severity: error|warning|info
  MD051: true

  # MD052: Defined reference labels
  # Knobs:
  #   - severity: error|warning|info
  MD052: true

  # MD053: Unused reference definitions
  # Knobs:
  #   - severity: error|warning|info
  MD053: true

  # MD054: Link and image style
  # Knobs:
  #   - severity: error|warning|info
  #   - autolink: true|false
  #   - inline: true|false
  #   - full: true|false
  #   - collapsed: true|false
  #   - shortcut: true|false
  #   - url_inline: true|false
  #   - each boolean option:
  #       - true
  #       - false
  MD054: false

  # MD055: Table pipe style
  # Knobs:
  #   - severity: error|warning|info
  #   - style: consistent|leading_and_trailing|leading_only|trailing_only|no_leading_or_trailing
  #   - style options:
  #       - consistent
  #       - leading_and_trailing
  #       - leading_only
  #       - trailing_only
  #       - no_leading_or_trailing
  MD055:
    style: leading_and_trailing

  # MD056: Table column count
  # Knobs:
  #   - severity: error|warning|info
  MD056: true

  # MD057: Indent must be consistent within list items
  # Enforces consistent indentation for wrapped text, nested paragraphs, sublists, and code blocks
  # inside list items. Prevents broken list rendering across Markdown engines.
  # Fix: Align all continuation lines under the list item marker using the same indent.
  MD057: true

  # MD058: Blank lines around tables
  # Knobs:
  #   - severity: error|warning|info
  MD058: true

  # MD059: Descriptive link text
  # Knobs:
  #   - severity: error|warning|info
  MD059: false

  # MD060: Table column style
  # Knobs:
  #   - severity: error|warning|info
  #   - style: aligned|compact|tight
  #   - style options:
  #       - aligned
  #       - compact
  #       - tight
  #
  # Note: ReadMe.com uses aligned by default
  MD060: false

globs:
  - "docs/**/*.md"
