# npx markdownlint-cli2 --fix --config .github/mdlint-cli2-config.yaml 'docs/**/*.md'

config:
  # MD001: Heading levels should only increment by one level at a time
  MD001: false

  # MD002: First heading should be a top-level heading
  MD002: false

  # MD003: Heading style (ATX vs Setext)
  MD003: false

  # MD004: Unordered list style (dash, plus, or asterisk)
  MD004: false

  # MD005: Inconsistent indentation for list items at the same level
  MD005: false

  # MD006: Consider starting bulleted lists at the beginning of the line
  MD006: false

  # MD007: Unordered list indentation
  MD007: false

  # MD009: Trailing spaces
  MD009: false

  # MD010: Hard tabs
  MD010: false

  # MD011: Reversed link syntax
  MD011: false

  # MD012: Multiple consecutive blank lines
  MD012: false

  # MD013: Line length
  MD013: false

  # MD014: Dollar signs used before commands without showing output
  MD014: false

  # MD018: No space after hash on ATX heading
  MD018: false

  # MD019: Multiple spaces after hash on ATX heading
  MD019: false

  # MD020: No space inside hashes on closed ATX heading
  MD020: false

  # MD021: Multiple spaces inside hashes on closed ATX heading
  MD021: false

  # MD022: Headings should be surrounded by blank lines
  MD022: false

  # MD023: Headings must start at the beginning of the line
  MD023: false

  # MD024: Multiple headings with the same content
  MD024: false

  # MD025: Multiple top-level headings in the same document
  MD025: false

  # MD026: Trailing punctuation in headings
  MD026: false

  # MD027: Multiple spaces after blockquote symbol
  MD027: false

  # MD028: Blank line inside blockquote
  MD028: false

  # MD029: Ordered list item prefix (numeric vs sequential)
  MD029: false

  # MD030: Spaces after list markers
  MD030: false

  # MD031: Fenced code blocks should be surrounded by blank lines
  MD031: false

  # MD032: Lists should be surrounded by blank lines
  MD032: false

  # MD033: Inline HTML
  MD033: false

  # MD034: Bare URL used instead of angle brackets or link syntax
  MD034: false

  # MD035: Horizontal rule style
  MD035: false

  # MD036: Emphasis used instead of a heading
  MD036: false

  # MD037: Spaces inside emphasis markers
  MD037: false

  # MD038: Spaces inside code span elements
  MD038: false

  # MD039: Spaces inside link text
  MD039: false

  # MD040: Fenced code blocks should have a language specified
  MD040: false

  # MD041: First line in file should be a top-level heading
  MD041: false

  # MD042: No empty links
  MD042: false

  # MD043: Required heading structure
  MD043: false

  # MD044: Proper names should have the correct capitalization
  MD044: false

  # MD045: Images should have alternate text (alt attribute)
  MD045: false

  # MD046: Code block style (fenced vs indented)
  MD046: false

  # MD047: Files should end with a single newline character
  MD047: false

  # MD048: Code fence style (backticks vs tildes)
  MD048: false

  # MD049: Emphasis style (* vs _)
  MD049: false

  # MD050: Strong style (** vs __)
  MD050: false

  # MD051: Link fragments should be valid
  MD051: false

  # MD052: Reference links and images should use a label that is defined
  MD052: false

  # MD053: Link and image reference definitions should be needed
  MD053: false

  # MD054: Link and image style
  MD054: false

  # MD055: Table pipe style
  MD055: false

  # MD056: Table column count
  MD056: false

  # MD058: Tables should be surrounded by blank lines
  MD058: false

  # MD059: Link text should be descriptive
  MD059: false

  # MD060: Table column style
  MD060: false

globs:
  - "docs/**/*.md"
