  # AKY018: Require canonical Markdown table separator rows
  #
  # Purpose:
  #   Enforces a single table style for readability and consistency.
  #
  # Canonical separator row format:
  #   | --- | --- |
  #
  # Flags examples such as:
  #   |---|---|
  #   | :--- | :--- |
  #   | ---- | ---: |
  AKY018: true

  # AKY019: Remove unnecessary repeated spaces outside code
  #
  # Purpose:
  #   Auto-fixes repeated spaces in prose by collapsing them to a single space.
  #
  # Behavior:
  #   - Ignores fenced and indented code blocks.
  #   - Ignores inline code spans.
  #   - Applies fixes when markdownlint runs with --fix.
  AKY019: true

  # AKY020: Enforce emoji-prefixed blockquote callout titles
  #
  # Required format:
  #   > [emoji] **Label:**
  #   > [emoji] **Label (Context):**
  #
  # Supported label and emoji mapping:
  #   - Note, Info: ℹ️
  #   - Tip: ✅
  #   - Warning: ⚠️
  #   - Important: ❗
  #   - Caution: 🚫
  AKY020:
    severity: warning

  # AKY021: Disallow angle-bracket URL autolinks (<http://...> / <https://...>)
  #
  # Purpose:
  #   ReadMe.com renders Markdown as MDX. The CommonMark angle-bracket autolink
  #   syntax <https://example.com> is parsed as a JSX element by the MDX parser
  #   and causes a hard parse error: "Unexpected character `/` before local name".
  #
  # Fix:
  #   Replace <url> with a proper Markdown link: [url](url) or [descriptive text](url).
  #
  # Auto-fixable: yes — markdownlint --fix rewrites <url> as [url](url).
  #
  # Knobs:
  #   - severity: error|warning|info
  AKY021: true

  # AKY022: Validate fenced code info strings against allowlisted languages and tabs
  # Knobs:
  #   - severity: error|warning|info
  #   - languages_file: path to allowed first-token language identifiers
  #   - tabs_file: path to allowed tab labels after the language identifier
  AKY022:
    languages_file: .github/markdownlint/fence-languages.txt
    tabs_file: .github/markdownlint/fence-tabs.txt

  # AKY023: Disallow real-looking cloud account identifiers in docs examples
  # Required placeholders when needed:
  #   <service-account-name>@<project-id>.iam.gserviceaccount.com
  #   arn:aws:iam::<aws-account-id>:root
  #   <azure-tenant-id>, <azure-subscription-id>, <azure-client-id>
  #   <resource-ocid>
  AKY023: true

  # =========================
  # Core markdownlint Rules
  # =========================

  # MD001: Heading levels should only increment by one level
  # Knobs:
  #   - severity: error|warning|info
  MD001: true

  # MD002: First heading should be top-level
  # Knobs:
  #   - severity: error|warning|info
  MD002: true

  # MD003: Heading style (ATX vs Setext)
  # Knobs:
  #   - severity: error|warning|info
  #   - style: consistent|atx|setext
  #   - style options:
  #       - consistent
  #       - atx
  #       - setext
  MD003:
    style: atx

  # MD004: Unordered list style
  # Knobs:
  #   - severity: error|warning|info
  #   - style: consistent|dash|asterisk|plus
  #   - style options:
  #       - consistent
  #       - dash
  #       - asterisk
  #       - plus
  MD004:
    style: asterisk

  # MD005: Inconsistent list indentation
  # Knobs:
  #   - severity: error|warning|info
  MD005: true

  # MD006: Lists should start at beginning of line
  # Knobs:
  #   - severity: error|warning|info
  MD006: true

  # MD007: Unordered list indentation
  # Knobs:
  #   - severity: error|warning|info
  #   - indent: integer (common values: 2|4)
  #   - start_indented: true|false
  #   - indent examples:
  #       - 2
  #       - 4
  #   - start_indented options:
  #       - true
  #       - false
  MD007:
    start_indented: false
    indent: 4

  # MD008: Unordered nested list indentation
  # Ensures consistent indentation for items in unordered lists.
  # Helps keep nested lists readable and avoids Markdown rendering differences
  # across tools and platforms.
  #
  # Knobs:
  #   - severity: error|warning|info
  #   - indent: integer (common values: 2|4)
  #   - start_indented: true|false
  #
  # indent examples:
  #   - 2
  #   - 4
  #
  # start_indented options:
  #   - true
  #   - false
  MD008:
    start_indented: false
    indent: 4
    

  # MD009: Trailing spaces
  # Knobs:
  #   - severity: error|warning|info
  #   - br_spaces: integer (common: 0|2)
  #   - list_item_empty_lines: true|false
  #   - strict: true|false
  #   - br_spaces examples:
  #       - 0
  #       - 2
  #   - list_item_empty_lines options:
  #       - true
  #       - false
  #   - strict options:
  #       - true
  #       - false
  MD009: true

  # MD010: Hard tabs
  # Knobs:
  #   - severity: error|warning|info
  #   - code_blocks: true|false
  #   - code_blocks options:
  #       - true
  #       - false
  MD010:
    code_blocks: true

  # MD011: Reversed link syntax
  # Knobs:
  #   - severity: error|warning|info
  MD011: true

  # MD012: Multiple consecutive blank lines
  # Knobs:
  #   - severity: error|warning|info
  #   - maximum: integer (common: 1|2)
  #   - maximum examples:
  #       - 1
  #       - 2
  MD012: true

  # MD013: Line length
  # Knobs:
  #   - severity: error|warning|info
  #   - line_length: integer
  #   - heading_line_length: integer
  #   - code_block_line_length: integer
  #   - code_blocks: true|false
  #   - tables: true|false
  #   - headings: true|false
  #   - strict: true|false
  #   - stern: true|false
  #   - common integer examples:
  #       - 80
  #       - 100
  #       - 120
  #   - boolean options:
  #       - true
  #       - false
  MD013:
    line_length: 1000
    headings: true
    heading_line_length: 120
    code_blocks: false
    code_block_line_length: 9999
    tables: false
    strict: false
    stern: true

  # MD014: Disallow dollar signs ($) before shell commands
  # Knobs:
  #   - severity: error|warning|info
  MD014: true

  # MD018: No space after hash in ATX headings
  # Knobs:
  #   - severity: error|warning|info
  MD018: true

  # MD019: Multiple spaces after hash
  # Knobs:
  #   - severity: error|warning|info
  MD019: true

  # MD020: No space inside closed ATX headings
  # Knobs:
  #   - severity: error|warning|info
  MD020: true

  # MD021: Multiple spaces inside closed ATX headings
  # Knobs:
  #   - severity: error|warning|info
  MD021: true

  # MD022: Headings surrounded by blank lines
  # Knobs:
  #   - severity: error|warning|info
  MD022: true

  # MD023: Headings must start at beginning of line
  # Knobs:
  #   - severity: error|warning|info
  MD023: true

  # MD024: Duplicate heading content
  # 
  # Note: This isn't ready yet, specifically because of the CLI Reference
  # 
  # Knobs:
  #   - severity: error|warning|info
  #   - allow_different_nesting: true|false
  #   - siblings_only: true|false
  #   - allow_different_nesting options:
  #       - true
  #       - false
  #   - siblings_only options:
  #       - true
  #       - false
  MD024: false

  # MD025: Multiple top-level headings
  # Knobs:
  #   - severity: error|warning|info
  #   - level: integer (commonly 1)
  #   - front_matter_title: string (pattern; empty disables)
  #   - level examples:
  #       - 1
  #       - 2
  #   - front_matter_title examples:
  #       - ""
  #       - "title"
  #       - "^\s*title\s*[:=]"
  MD025: true

  # MD026: Trailing punctuation in headings
  # Knobs:
  #   - severity: error|warning|info
  #   - punctuation: string (characters to disallow)
  #   - punctuation examples:
  #       - ".,;:!?"
  #       - ".,;:"
  MD026: true

  # MD027: Multiple spaces after blockquote symbol
  # Knobs:
  #   - severity: error|warning|info
  MD027: true

  # MD028: Blank line inside blockquote
  # Knobs:
  #   - severity: error|warning|info
  MD028: true

  # MD029: Ordered list marker style
  # Knobs:
  #   - severity: error|warning|info
  #   - style: one_or_ordered|one|ordered
  #   - style options:
  #       - one_or_ordered
  #       - one
  #       - ordered
  MD029:
    style: one_or_ordered

  # MD030: Spaces after list markers
  # Knobs:
  #   - severity: error|warning|info
  #   - ul_single: integer
  #   - ol_single: integer
  #   - ul_multi: integer
  #   - ol_multi: integer
  #   - common integer examples:
  #       - 1
  #       - 2
  MD030:
      ul_single: 1
      ol_single: 1
      ul_multi: 1
      ol_multi: 1

  # MD031: Fenced code blocks surrounded by blank lines
  # DO NOT USE. This is incompatible with how ReadMe.com handles code block tabbing.
  # Knobs:
  #   - severity: error|warning|info
  MD031: false

  # MD032: Lists surrounded by blank lines
  # Knobs:
  #   - severity: error|warning|info
  MD032: true

  # MD033: Inline HTML
  # Knobs:
  #   - severity: error|warning|info
  #   - allowed_elements: [string]
  #   - allowed_elements examples:
  #       - []
  #       - ["details", "summary"]
  #       - ["br", "kbd", "sup", "sub"]
  MD033:
    allowed_elements:
      - "details"
      - "summary"
      - "video"
      - "source"
      - "svg"
      - "path"
      # ReadMe Proprietary
      - "HTMLBlock"
      - "Image"
      # Keep "Callout" allowed here so MD033 does not hard-fail.
      # AKY011 is the enforcement mechanism and is intentionally warning-level,
      # so authors receive an alert without automatic replacement.
      - "Callout"
      - "Anchor"
      - "Embed"
      - "Recipe"
      - "Tabs"
      - "Tab"
      - "Cards"
      - "Card"
      - "Columns"
      - "Column"
      - "Accordion"
      # ReadMe Reusable Elements
      - "CLIGeneralFlags"
      - "ApiKeyWarning"

  # MD034: Bare URLs
  # Knobs:
  #   - severity: error|warning|info
  MD034: true

  # MD035: Horizontal rule style
  # Knobs:
