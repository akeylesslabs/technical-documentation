# npx cspell "**/*.md" --no-progress

# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json

# The version of the configuration file format.
version: "0.2"
# The locale to use when spell checking. (e.g., en, en-GB, de-DE
language: en

dictionaries:
  - en_US
  - companies
  - markdown
  - softwareTerms
  - html
  - bash
  - powershell
  - filetypes
  # Custom Dictionaries
  - akeyless-standard
  - akeyless-proper-nouns

ignorePaths:
  - .cspell/**
  - .github/**
  - .other/**
  - .venv/**
  - recipes/**
  - reference/**
  - samples/**
  - .gitignore
  - cspell.config.yaml
  - docs/Contributing Guides/look-feel-sample-page-title.md

dictionaryDefinitions:
  - name: akeyless-proper-nouns
    path: .cspell/akeyless-proper-nouns-dictionary.txt
    addWords: true
  - name: akeyless-standard
    path: .cspell/akeyless-standard-dictionary.txt
    addWords: true

overrides:
  - filename: "**/*.md"
    languageId: markdown
    ignoreRegExpList:
      - /`[^`]*`/
      - /```[\s\S]*?```/
